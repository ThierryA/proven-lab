        post:
            summary: MCP server (Streamable HTTP transport)
            description: >-
                Exposes the gateway as a remote MCP server over the Streamable HTTP transport (JSON-RPC 2.0 over HTTP, optionally upgrading to Server-Sent Events for streamed responses). Accepts either a WP Engine API key (prefixed "wpe_") carrying the mcp scope, scoped to the key's project, or an Okta JWT with WPEngine-Account and WPEngine-Project headers (Standalone Coworker). A token issued for a support impersonation session is refused with `403`. An API-key caller receives a deprecation notice in the connect instructions and in each tool result's `_meta["com.wpengine/deprecation"]`. The result's content is unchanged. Where API keys are disabled, a key still connects, initializes and lists tools, and every tool call returns the tool error `forbidden`. External MCP clients (e.g. Claude Desktop) can instead use interactive OAuth sign-in, discovered through `/.well-known/oauth-protected-resource/v1/mcp`. An OAuth access token must grant a scope for each tool it calls: `urn:wpengine:ai:wordpress:rw` for the site, knowledge base and ability tools, and `urn:wpengine:hosting:tools:rw` for the WP Engine account and environment tools. A request whose token lacks the scope returns `403` with `WWW-Authenticate: Bearer error="insufficient_scope", scope="..."` naming the scopes to request: the token's current scopes plus the one required. An OAuth access token names a person, not an account, so for such a caller the site, ability and search tools (`list_account_sites`, `list_site_abilities`, `run_site_ability` and `search_abilities`) take a required `account_id`. `list_accounts`, offered only to these callers, returns the accounts the person holds that have connected sites. An `account_id` the person does not hold returns the tool error `account_not_found`. An account the person holds that is not enabled for WP Engine AI APIs returns the tool error `entitlement_required`, or `entitlement_unavailable` when that cannot be checked. A person none of whose accounts is enabled is refused with `403` `entitlement_required`, or `account_required` when they hold no account. API-key and Okta callers do not pass `account_id`. Scopes do not apply to API keys or Okta JWTs. The gateway does not preserve MCP session state between requests; clients should not rely on server-side session continuity across calls. The `list_site_abilities`, `search_abilities`, and `run_site_ability` tools additionally require a personal API key when using API-key auth; a project-scoped key resolves no acting user and these tools return an unauthorized error. Okta JWT callers use the verified subject instead. For `run_site_ability`, a timed-out read returns the tool error code `timeout`, including when WordPress reports an upstream timeout with a REST 504 response. Any WordPress error code and message are retained in the tool error message. Retrying the identical read is safe. An uncertain write returns `ambiguous_outcome` and must not be retried automatically. An account-wide `search_abilities` with no connected sites returns `found: false` and `reason: no_connected_sites` for OAuth and Okta callers, with `help` and `next_steps` directing the client to list sites with pagination and ask the user which site to connect. It does not select a connection URL implicitly. Personal API keys with no active connection receive the same selection guidance in a `not_personally_connected` tool error. `list_account_sites` includes `requires_https` on each site, computed from the recorded site URL on that page, so a client can skip sites that cannot start a personal connection without another lookup. Site-specific calls return guidance for the selected site. Site abilities publish their own input and output schemas through discovery. When available, `wp-engine-ai/search-content` performs literal search of editable stored content and REST-exposed custom fields, rather than relevance-ranked knowledge-base search. Matching ignores letter case by default; set `case_sensitive: true` for exact case. Each call visits up to 200 posts subject to work and result limits. Pass its returned `next_cursor` as `cursor` with the same query, case mode, scope and limit until `complete` is true; an empty page does not imply completion. Each ability response returns up to 100 occurrences by default, with a maximum of 200 occurrences and 100,000 encoded JSON bytes, excluding the MCP transport envelope. Every literal occurrence, including overlaps, produces a result with a zero-based Unicode character `match_offset` within its stored string leaf and a preview. Field identities can repeat at different offsets. Incomplete pages have `totals: null`. Cursors use compact unpadded base64url and must be copied unchanged, including letter case, with the original limit and search options. The final page has cumulative `totals` across all pages: `matched_posts`, `matched_fields`, and `occurrences`, even when its `matches` is empty. Separate metadata rows count as separate matching fields. Summaries should use these totals verbatim rather than recounting generated tables. Search results identify update targets, not replacement values or a snapshot of the site. When available, `wp-engine-ai/replace-content` applies an approved literal, case-sensitive, non-overlapping replacement to stored post content and/or manual excerpts. Send `ids`, `find` and `replace`; optional `fields` defaults to `["content"]`. Explicitly select `["excerpt"]` for excerpts only or `["content","excerpt"]` for both. Only changed selected fields are written, together per post. A changed field that the post endpoint does not accept fails that post with `unknown_fields` before any selected field is saved. Core pages expose writable REST excerpts even without editor excerpt support. Custom types/controllers must expose the selected field. Generated excerpts, meta/custom fields and ACF are not replaced. Empty, duplicate or unsupported field selections reject the request before reads or writes. An empty replacement deletes the text. Search for equivalent targets with the same `fields` and `case_sensitive: true`. `wp-engine-ai/manage-posts` applies the same status, categories and/or tags to explicit `ids`, with no action selector or replacement inputs. `categories` and `tags` replace complete sets. Each category/tag list accepts at most 100 input entries before deduplication. Over-limit lists reject the entire request before reads or writes. Larger incremental tag changes can be split across calls; never split full-set category/tag replacements, since each call replaces the complete set. Use `tags_add` to add existing tag IDs or `tags_remove` to remove only those IDs, preserving all unrelated tags. Both delta fields may be combined with each other or status/categories, but not with `tags`; overlapping addition/removal IDs reject the request before writes. Already-present additions and absent removals are unchanged without a write. Tag deltas require a writable REST-visible tags field and term assignment permissions. Non-mutating PATCH probes honor matched REST route permissions and REST policy filters before each native tag operation without running the controller's full-set save. A failed entry with `partial: true` means some changes may already have landed; inspect current state before retrying. No rollback is performed. Ordinary PATCH errors are potentially partial too: core fields can save before a later operation fails. Authorized read-back verifies status/term values; content and excerpt differences are not compared because WordPress save filters may alter them. Unavailable verification is explicitly reported with `diagnostics_truncated`; zero `not_applied_count` then is not proof that requested values landed. Both tools accept at most 50 positive integer ID entries per call. Deduplicate `search-content` match IDs after collecting every page and split approved IDs into batches. Both check a 10-second cooperative budget before starting each post. After expiry, remaining IDs are `failed` with reason `not_attempted`, included in `failed_count`, and were not read or written. Completed outcomes are preserved. Submit only those unattempted IDs in a new approved call, never replay the entire batch. Catchable unexpected site errors also stop the batch: completed outcomes remain, the interrupted post fails with `execution_failed` or `wp_fatal_error`, and later IDs are `not_attempted`. A started write makes the interrupted post potentially partial with unverified, truncated diagnostics. Expected WordPress error responses remain per-post failures. A started post normally finishes its mutation and verification before the next deadline check. A blocking save hook/controller or shorter host/gateway timeout can still prevent a result envelope; inspect current state instead of automatically retrying that ambiguous outcome. Invalid IDs and unsupported fields reject the batch before writes; individual permission or save failures do not roll back other posts. Already-matching values are returned as `unchanged` without a write. Both require an editable supported post type and recheck each ID. Inspect per-post `not_applied_count` and `not_applied` for requested status or terms ignored or changed on save. Full result envelopes are capped at 100,000 encoded bytes, retaining all IDs, outcomes and counts. `diagnostics_truncated` marks shortened diagnostics, `values_truncated` marks shortened requested/stored value previews within a diagnostic entry, and `diagnostics_error` reports unavailable diagnostics. Never retry changed IDs to retrieve diagnostics; replacement is not necessarily idempotent. Search results do not authorize writes. Fresh content is read at execution, but there is no snapshot or atomic conflict guard. Site-written strings and object keys in `run_site_ability`, `get_site_knowledge_base`, `search_knowledge_base`, and `fetch_knowledge_base_document` results have invisible characters removed. Each serialized result is limited to 128 KiB. Larger results are replaced with `{"result_truncated":true,"excerpt":"... [tool result truncated]"}`; the excerpt is a JSON prefix, not a complete document. Error messages are similarly cleaned and limited to 16 KiB of JSON-encoded text.
