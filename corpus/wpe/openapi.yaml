openapi: "3.0.3"
info:
    title: AI Gateway
    description: >-
        An OpenAI-compatible API gateway that routes chat completion and image generation requests to multiple upstream AI providers (OpenAI, Google Gemini, Anthropic) based on the model prefix in the request.

        [Download the OpenAPI spec](https://api.ai.wpengine.com/v1/openapi.yaml) to import it into Postman, Bruno, or a client generator.
    version: "0.15"
    contact:
        name: WP Engine AI Documentation
servers:
    - url: /
      description: Current environment
security:
    - bearerAuth: []
tags:
    - name: "Product: AI Gateway"
      description: >-
        Operations that belong to the AI Gateway product. This is a product grouping, not a feature: each of these operations also appears under its feature tag. The product covers model inference and helper endpoints (chat completions, messages, image generation, speech, transcription, and WordPress content helpers such as alt text, summaries, and taxonomy suggestions), plus API keys and usage.
paths:
    /v1/models:
        get:
            x-publish-external-docs: true
            summary: List available models
            description: >-
                Returns the model catalog with rate-card pricing and display metadata. No authentication is required.
            operationId: listModels
            tags:
                - Models
                - "Product: AI Gateway"
            security:
                - {}
            responses:
                "200":
                    description: List of supported models
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ModelsResponse"
                "429":
                    $ref: "#/components/responses/RateLimited"
    /v1/models/{owner}/{model}/schema:
        get:
            x-publish-external-docs: true
            summary: Get model schema
            description: >-
                Returns the generated request (input) and response (output) JSON Schemas for a single model. The model ID is namespaced as "owner/name", where owner is the model's vendor (anthropic, google, ...). The schemas describe the chat completion contract, so only chat-capable models are served; unknown or non-chat models return 404. No authentication is required.
            operationId: getModelSchema
            tags:
                - Models
                - "Product: AI Gateway"
            security:
                - {}
            parameters:
                - name: owner
                  in: path
                  required: true
                  description: Owner (vendor) segment of the namespaced model ID.
                  schema:
                    type: string
                  example: anthropic
                - name: model
                  in: path
                  required: true
                  description: Model-name segment of the namespaced model ID.
                  schema:
                    type: string
                  example: claude-haiku-4-5
            responses:
                "200":
                    description: Generated input and output JSON Schemas for the model
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ModelSchemaResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "404":
                    $ref: "#/components/responses/NotFound"
                "429":
                    $ref: "#/components/responses/RateLimited"
    /v1/chat/completions:
        post:
            x-publish-external-docs: true
            summary: Create a chat completion
            description: >-
                Requires a valid WP Engine bearer token. API keys must carry the "chat:write" permission.
            operationId: createChatCompletion
            tags:
                - Chat
                - "Product: AI Gateway"
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ChatCompletionRequest"
            responses:
                "200":
                    description: >-
                        Chat completion response. When stream is false, returns a single JSON object. When stream is true, returns Server-Sent Events with chunked JSON payloads terminated by a "data: [DONE]" message.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ChatCompletionResponse"
                        text/event-stream:
                            schema:
                                description: SSE stream of ChatCompletionChunk objects
                                type: string
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "402":
                    $ref: "#/components/responses/InsufficientCredits"
                "404":
                    $ref: "#/components/responses/NotFound"
                "413":
                    $ref: "#/components/responses/RequestTooLarge"
                "429":
                    $ref: "#/components/responses/RateLimited"
                "502":
                    $ref: "#/components/responses/BadGateway"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
                default:
                    $ref: "#/components/responses/UpstreamPassthrough"
    /v1/messages:
        post:
            x-publish-external-docs: true
            summary: Create a message (Anthropic Messages API)
            description: >-
                Anthropic-native Messages endpoint, compatible with official Anthropic SDKs. Accepts the standard Anthropic Messages request shape, including system prompts, multi-turn conversations, image content blocks, tool use, extended thinking, custom stop sequences, and streaming. Prompt caching is supported: add "cache_control" breakpoints to your request (on system, tools, or message content) to cache stable prefixes; cached-token counts are reported as "cache_creation_input_tokens" and "cache_read_input_tokens" in the response usage. Authenticate with a WP Engine bearer token, or with the Anthropic SDK convention of an "x-api-key" header carrying a WP Engine API key. API keys must carry the "chat:write" permission. The model field accepts prefixed ("anthropic/claude-sonnet-4-6") or bare ("claude-sonnet-4-6") names; only Anthropic models are supported. The "anthropic-version" and "anthropic-beta" headers are accepted and forwarded. All errors are returned in Anthropic's error envelope format.
            operationId: createMessage
            tags:
                - Messages
                - "Product: AI Gateway"
            security:
                - bearerAuth: []
                - anthropicApiKey: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AnthropicMessagesRequest"
            responses:
                "200":
                    description: >-
                        Anthropic message response. When stream is false, returns a single JSON message object. When stream is true, returns Server-Sent Events using Anthropic's streaming event protocol (message_start, content_block_delta, message_delta, message_stop, ...).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AnthropicMessagesResponse"
                        text/event-stream:
                            schema:
                                description: SSE stream of Anthropic message events
                                type: string
                "400":
                    $ref: "#/components/responses/AnthropicBadRequest"
                "401":
                    $ref: "#/components/responses/AnthropicUnauthorized"
                "402":
                    $ref: "#/components/responses/AnthropicInsufficientCredits"
                "403":
                    $ref: "#/components/responses/AnthropicForbidden"
                "404":
                    $ref: "#/components/responses/AnthropicNotFound"
                "413":
                    $ref: "#/components/responses/AnthropicRequestTooLarge"
                "429":
                    $ref: "#/components/responses/RateLimited"
                "502":
                    $ref: "#/components/responses/AnthropicBadGateway"
                "503":
                    $ref: "#/components/responses/AnthropicServiceUnavailable"
                default:
                    $ref: "#/components/responses/AnthropicUpstreamError"
    /v1/messages/count_tokens:
        post:
            x-publish-external-docs: true
            summary: Count message tokens (Anthropic Messages API)
            description: >-
                Counts the input tokens a Messages request would consume, without creating a message or incurring model usage. Accepts the same request shape as /v1/messages minus max_tokens. Authentication matches /v1/messages: a WP Engine bearer token or an "x-api-key" header; API keys must carry the "chat:write" permission. Some models do not support token counting and return a 400 error.
            operationId: countMessageTokens
            tags:
                - Messages
                - "Product: AI Gateway"
            security:
                - bearerAuth: []
                - anthropicApiKey: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AnthropicCountTokensRequest"
            responses:
                "200":
                    description: Token count for the supplied request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AnthropicCountTokensResponse"
                "400":
                    $ref: "#/components/responses/AnthropicBadRequest"
                "401":
                    $ref: "#/components/responses/AnthropicUnauthorized"
                "403":
                    $ref: "#/components/responses/AnthropicForbidden"
                "404":
                    $ref: "#/components/responses/AnthropicNotFound"
                "413":
                    $ref: "#/components/responses/AnthropicRequestTooLarge"
                "429":
                    $ref: "#/components/responses/RateLimited"
                "502":
                    $ref: "#/components/responses/AnthropicBadGateway"
                "503":
                    $ref: "#/components/responses/AnthropicServiceUnavailable"
                default:
                    $ref: "#/components/responses/AnthropicUpstreamError"
    /v1/images/generations:
        post:
            x-publish-external-docs: true
            summary: Generate images from a text prompt
            description: >-
                Requires a valid WP Engine bearer token. API keys must carry the "image:write" permission.
            operationId: createImageGeneration
            tags:
                - Images
                - "Product: AI Gateway"
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ImageGenerationRequest"
            responses:
                "200":
                    description: Generated images
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ImageGenerationResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "402":
                    $ref: "#/components/responses/InsufficientCredits"
                "413":
                    $ref: "#/components/responses/RequestTooLarge"
                "429":
                    $ref: "#/components/responses/RateLimited"
                "502":
                    $ref: "#/components/responses/BadGateway"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
                default:
                    $ref: "#/components/responses/UpstreamPassthrough"
    /v1/images/alt-text:
        post:
            x-publish-external-docs: true
            summary: Generate image metadata
            description: >-
                Accepts a base64-encoded image and returns AI-generated metadata including alt-text, title, caption, and description suitable for WordPress media library entries. Maximum image size is 20 MiB. Requires a valid WP Engine bearer token; API keys must carry the "image:write" permission.
            operationId: createImageAltText
            tags:
                - Images
                - "Product: AI Gateway"
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AltTextRequest"
            responses:
                "200":
                    description: Generated image metadata
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AltTextResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "402":
                    $ref: "#/components/responses/InsufficientCredits"
                "413":
                    $ref: "#/components/responses/RequestTooLarge"
                "429":
                    $ref: "#/components/responses/RateLimited"
                "502":
                    $ref: "#/components/responses/BadGateway"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
    /v1/content/summarize:
        post:
            x-publish-external-docs: true
            summary: Summarize content
            description: >-
                Analyzes content and generates multiple summary formats suitable for different publishing contexts: alternative headline, editorial summary, SEO meta description, social media sharing text, and key points. Requires a valid WP Engine bearer token; API keys must carry the "chat:write" permission.
            operationId: summarizeContent
            tags:
                - Content
                - "Product: AI Gateway"
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SummaryRequest"
            responses:
                "200":
                    description: Multi-format content summaries
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SummaryResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "402":
                    $ref: "#/components/responses/InsufficientCredits"
                "413":
                    $ref: "#/components/responses/RequestTooLarge"
                "429":
                    $ref: "#/components/responses/RateLimited"
                "502":
                    $ref: "#/components/responses/BadGateway"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
    /v1/content/suggest-taxonomy:
        post:
            x-publish-external-docs: true
            summary: Suggest categories and tags for content
            description: >-
                Analyzes content and suggests categories from a provided list and relevant tags. Tags are cross-referenced against an optional approved list and flagged as "existing" or "new". Net-new tags are filtered by a configurable confidence threshold. Requires a valid WP Engine bearer token; API keys must carry the "chat:write" permission.
            operationId: suggestTaxonomy
            tags:
                - Content
                - "Product: AI Gateway"
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TaxonomyRequest"
            responses:
                "200":
                    description: Suggested categories and tags
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TaxonomyResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "402":
                    $ref: "#/components/responses/InsufficientCredits"
                "413":
                    $ref: "#/components/responses/RequestTooLarge"
                "429":
                    $ref: "#/components/responses/RateLimited"
                "502":
                    $ref: "#/components/responses/BadGateway"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
    /v1/audio/speech:
        post:
            x-publish-external-docs: true
            summary: Generate speech from text
            description: >-
                Converts text input to audio using a text-to-speech model. Returns binary audio data with the appropriate Content-Type header. Requires a valid WP Engine bearer token; API keys must carry the "speech:write" permission.
            operationId: createSpeech
            tags:
                - Audio
                - "Product: AI Gateway"
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/SpeechRequest"
            responses:
                "200":
                    description: Generated audio data
                    content:
                        audio/wav:
                            schema:
                                type: string
                                format: binary
                        audio/L16:
                            schema:
                                type: string
                                format: binary
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "402":
                    $ref: "#/components/responses/InsufficientCredits"
                "413":
                    $ref: "#/components/responses/RequestTooLarge"
                "429":
                    $ref: "#/components/responses/RateLimited"
                "502":
                    $ref: "#/components/responses/BadGateway"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
    /v1/analytics:
        get:
            x-publish-external-docs: true
            summary: Query usage analytics
            description: >-
                Returns credit consumption and request counts aggregated into time-bucketed slots for a given project and time range. Requires account-level Okta authentication.
            operationId: getAnalytics
            tags:
                - Analytics
            security:
                - bearerAuth: []
            parameters:
                - name: project_id
                  in: query
                  required: true
                  schema:
                    type: string
                  description: The project to query analytics for.
                - name: start_time
                  in: query
                  required: true
                  schema:
                    type: integer
                    format: int64
                    minimum: 0
                    maximum: 253370764800
                  description: Start of the query window as a Unix timestamp in seconds (inclusive).
                - name: end_time
                  in: query
                  required: false
                  schema:
                    type: integer
                    format: int64
                    minimum: 0
                    maximum: 253370764800
                  description: End of the query window as a Unix timestamp in seconds (exclusive). Defaults to the current time.
                - name: bucket_width
                  in: query
                  required: false
                  schema:
                    type: string
                    enum: [10m, 1h, 1d]
                    default: 1d
                  description: >-
                    Width of each time bucket in the response. Defaults to 1d. Maximum query windows per bucket_width: 10m → 24 hours, 1h → 7 days, 1d → 30 days. The 1d limit is 721 hours so a 30-calendar-day window that spans a daylight saving time change is accepted.
                - name: client_id
                  in: query
                  required: false
                  schema:
                    type: string
                    maxLength: 64
                  description: >-
                    Filter results to a single registered site, identified by the client_id returned by the sites API. When omitted, all sites are included. Usage with no registered site (console, playground and direct API-key traffic) is reported with an empty client_id and cannot be selected by this filter.
                - name: auth_method
                  in: query
                  required: false
                  schema:
                    type: string
                    enum: [browser_session, api_key, service_token, okta, internal_service, unknown]
                  description: >-
                    Filter results by authentication method. When omitted, all auth methods are included. browser_session: browser-session traffic. api_key: API key traffic. service_token: service-token callers. okta: Okta-authenticated callers. internal_service: internal service-to-service calls. unknown: unclassified auth.
                - name: actor_type
                  in: query
                  required: false
                  schema:
                    type: string
                    enum: [anonymous, authenticated, service, unknown]
                  description: >-
                    Filter results by actor type. When omitted, all actor types are included. anonymous: unauthenticated end users. authenticated: logged-in end users. service: service accounts. unknown: actor type not yet determined.
                - name: application
                  in: query
                  required: false
                  schema:
                    type: string
                    enum: [wpe-ai-chatbot, wpe-ai-playground, power-coworker, console-coworker, power-connector, wpe-agents, wpe-kb-sync, third_party, unknown]
                  description: >-
                    Filter results by calling application. When omitted, all applications are included. wpe-ai-chatbot: WP Engine AI Chatbot. wpe-ai-playground: WP Engine AI Playground. power-coworker: WP Engine AI Coworker. console-coworker: WP Engine AI Coworker web app. power-connector: WP Engine AI Connector. wpe-agents: WP Engine Agents. wpe-kb-sync: WP Engine knowledge-base sync. third_party: any other identified caller. unknown: no caller user-agent present.
                - name: group_by
                  in: query
                  required: false
                  schema:
                    type: string
                  description: >-
                    Comma-separated list of dimension columns to group results by. When omitted, results are grouped by model and operation (preserving the default behaviour). Valid values: model, operation, client_id, site_id, auth_method, actor_type, application. site_id groups usage by the stable site identifier, so usage recorded under every client_id a site has used across credential rotation is reported as one series. Example: group_by=client_id,application.
            responses:
                "200":
                    description: Analytics data for the requested time range
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AnalyticsResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
    /v1/credits:
        get:
            x-publish-external-docs: true
            summary: Get account credit balance
            description: >-
                Returns the authenticated account's remaining credit balance. An account with no allocated balance reports zero. Requires account-level Okta authentication.
            operationId: getCredits
            tags:
                - Credits
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: The account's remaining credit balance
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/CreditsResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
    /v1/audio/transcriptions:
        post:
            x-publish-external-docs: true
            summary: Transcribe audio to text
            description: >-
                Accepts base64-encoded audio data and returns a text transcription. Supports common audio formats including WAV, MP3, OGG, WebM, and FLAC. Maximum audio size is 25 MiB. Requires a valid WP Engine bearer token; API keys must carry the "transcribe:write" permission.
            operationId: createTranscription
            tags:
                - Audio
                - "Product: AI Gateway"
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TranscriptionRequest"
            responses:
                "200":
                    description: Transcription result
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TranscriptionResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "402":
                    $ref: "#/components/responses/InsufficientCredits"
                "413":
                    $ref: "#/components/responses/RequestTooLarge"
                "429":
                    $ref: "#/components/responses/RateLimited"
                "502":
                    $ref: "#/components/responses/BadGateway"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
    /v1/sites:
        post:
            x-publish-external-docs: true
            summary: Register or update a WordPress site
            description: >-
                Registers a WordPress site with the AI Gateway, or updates an existing registration for the same site. The caller must authenticate with a WP Engine oauth-ext access token obtained via Dynamic Client Registration (RFC 7591). The gateway returns a stable site_id for the logical site; client_id continues to identify the current OAuth registration. Re-registering the same OAuth client updates its metadata in place. Request body is capped at 64 KiB. Unknown JSON fields are rejected. Returns 409 if the token's account_id differs from the account that originally registered the client_id (ownership conflict), or if an existing client moves to a site_url already owned by another site in the same account.
            operationId: registerSite
            tags:
                - Sites
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RegisterSiteRequest"
            responses:
                "200":
                    description: >-
                        Site registered or updated. Returns the stable site_id, client_id, registration status, the original creation timestamp (unchanged on updates), and the per-site HMAC secret for anonymous user identification.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RegisterSiteResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "409":
                    $ref: "#/components/responses/Conflict"
                "413":
                    $ref: "#/components/responses/RequestTooLarge"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
    /v1/sites/{client_id}:
        parameters:
            # Named client_id, not site_identifier: this parameter is already
            # published under that name, and generated clients bind to it by name
            # even though the URL is unchanged. Renaming it would break them at the
            # same time as this endpoint is gaining support for the second form.
            - name: client_id
              in: path
              required: true
              schema:
                type: string
              description: >-
                The site's stable `site_id`, or its `client_id` (the original credential identifier), which remains supported for backward compatibility.
        get:
            x-publish-external-docs: true
            summary: Get a site and its primary KB collection
            operationId: getSite
            tags:
                - Sites
            security:
                - bearerAuth: []
            responses:
                "200":
                    description: The site.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Site"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    description: Site not found, or the caller is not authorized for it.
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
        patch:
            x-publish-external-docs: true
            summary: Set or clear a site's primary KB collection
            operationId: updateSitePrimaryCollection
            tags:
                - Sites
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateSitePrimaryCollection"
            responses:
                "200":
                    description: The updated site.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Site"
                "400":
                    description: kb_collection_id missing or empty, or the collection does not belong to the site's project.
                "409":
                    description: The current primary collection does not match expected_kb_collection_id.
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    description: Site not found, or the caller is not authorized for it.
                "413":
                    $ref: "#/components/responses/RequestTooLarge"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
        delete:
