                        - type: object
                          properties:
                            id:
                                type: string
                            type:
                                type: string
                status:
                    type: string
                    enum: [idle, running, rescheduling, terminated, error]
                title:
                    type: string
                reasoning_effort:
                    type: string
                    description: >-
                        Session override for reasoning effort. Omitted when unset (the session inherits the agent's value, then the provider default).
                metadata:
                    type: object
                    additionalProperties:
                        type: string
                usage:
                    $ref: "#/components/schemas/SessionUsage"
                archived_at:
                    type: string
                    format: date-time
                    nullable: true
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                    nullable: true
                owner_id:
                    type: string
                    description: >-
                        Opaque per-visitor id recorded at creation, when the creator supplied one. Absent for sessions created without per-visitor attribution.
                site_ids:
                    type: array
                    items:
                        type: string
                    description: >-
                        Sites this session may work on, sorted. Empty when every site in the project is allowed.
        CreateSessionRequestV2:
            description: >-
                A session copies its agent's configuration, such as `model`, `system_prompt`, `temperature`, `max_tokens` and `tools`, and its profile when it is created, so later changes to the agent reach new sessions only. The fields the profile manages keep resolving from it, so a change to the profile itself reaches the session too. A field the session's profile owns (its `managed_fields`) cannot be overridden.
            allOf:
                - $ref: "#/components/schemas/CreateSessionRequest"
                - type: object
                  properties:
                    profile:
                        type: string
                        nullable: true
                        description: >-
                            Only null is accepted. It runs the session under no profile: the session keeps the values the agent's profile resolves when it is created, but later changes to the profile no longer reach it, and the profile's managed fields and allowed models no longer constrain it. Limited to first-party callers.
                    model:
                        type: string
                        maxLength: 255
                        description: >-
                            Model for this session only, in place of the agent's. Must support tool calling and, on a profiled agent, be one of its `allowed_models`. Omit to pin the agent's current model.
                    system_prompt:
                        type: string
                        maxLength: 32768
                        description: >-
                            System prompt for this session only. Rejected with 400 when the agent's profile owns `system_prompt`. Omit to pin the agent's current prompt.
                    temperature:
                        type: number
                        format: float
                        minimum: 0
                        maximum: 2
                        description: >-
                            Sampling temperature for this session only. Omit to pin the agent's current value.
                    max_tokens:
                        type: integer
                        minimum: 1
                        maximum: 200000
                        description: >-
                            Output token limit per turn for this session only (see the agent's `max_tokens`). Omit to pin the agent's current value.
                    tools:
                        type: array
                        maxItems: 128
                        description: >-
                            Tool declarations for this session only, replacing the agent's `tools` array. Omit to pin the agent's current tools.
                        items:
                            $ref: "#/components/schemas/AgentTool"
        UpdateSessionRequestV2:
            description: >-
                Partial update for a session. Omitting a field preserves it. On the agent override fields a value overrides the agent for this session under the same rules as CreateSessionRequestV2, and null resets the field to the agent's current value. Changing `model` without sending `reasoning_effort` clears an override the new model does not accept.
            allOf:
                - $ref: "#/components/schemas/UpdateSessionRequest"
                - type: object
                  properties:
                    model:
                        type: string
                        nullable: true
                        maxLength: 255
                        description: >-
                            Session model override (see CreateSessionRequestV2); 400 when empty. Null re-pins the agent's current model.
                    system_prompt:
                        type: string
                        nullable: true
                        maxLength: 32768
                        description: >-
                            Session system prompt override; 400 when the agent's profile owns it. Null re-pins the agent's current prompt, which is how a session picks up a changed profile prompt.
                    temperature:
                        type: number
                        format: float
                        nullable: true
                        minimum: 0
                        maximum: 2
                        description: Session temperature override. Null re-pins the agent's current value.
                    max_tokens:
                        type: integer
                        nullable: true
                        minimum: 1
                        maximum: 200000
                        description: Session max_tokens override. Null re-pins the agent's current value.
                    tools:
                        type: array
                        nullable: true
                        maxItems: 128
                        description: >-
                            Session tools override, replacing the agent's `tools` array. Null re-pins the agent's current tools.
                        items:
                            $ref: "#/components/schemas/AgentTool"
        SessionResponseV2:
            allOf:
                - $ref: "#/components/schemas/SessionResponse"
                - type: object
                  properties:
                    agent:
                        description: >-
                            The agent configuration this session runs with: the agent with the session's pinned configuration applied. Minimal {id, type} if the agent is deleted.
                        oneOf:
                            - $ref: "#/components/schemas/AgentResponse"
                            - type: object
                              properties:
                                id:
                                    type: string
                                type:
                                    type: string
                    model:
                        type: string
                        description: >-
                            Model the session pinned, omitted when it pinned none. This is the pinned override only; the model the session runs with is `agent.model`. A run clears a pinned model the catalog no longer serves or the agent's profile no longer allows, and the session then runs on the agent's model.
                    tools:
                        type: array
                        description: >-
                            Tools the session pinned. Omitted when it pinned none.
                        items:
                            $ref: "#/components/schemas/AgentTool"
        ListSessionsResponseV2:
            type: object
            required:
                - data
            properties:
                data:
                    type: array
                    items:
                        $ref: "#/components/schemas/SessionResponseV2"
                next_page:
                    type: string
                    description: Opaque cursor for next page.
        DeletedSessionResponse:
            type: object
            required:
                - id
                - type
            properties:
                id:
                    type: string
                type:
                    type: string
                    enum: [session_deleted]
        DeletedAgentResponse:
            type: object
            required:
                - id
                - type
            properties:
                id:
                    type: string
                type:
                    type: string
                    enum: [agent_deleted]
        ListSessionsResponse:
            type: object
            required:
                - data
            properties:
                data:
                    type: array
                    items:
                        $ref: "#/components/schemas/SessionResponse"
                next_page:
                    type: string
                    description: Opaque cursor for next page.
        SessionRollupResponse:
            type: object
            required:
                - total_count
                - active_count
                - total_credits_nano
            properties:
                total_count:
                    type: integer
                    description: Total number of non-deleted sessions matching the filters.
                active_count:
                    type: integer
                    description: Number of sessions currently in running, rescheduling, or queued status (does not include idle status).
                total_credits_nano:
                    type: integer
                    format: int64
                    description: Total lifetime credits consumed by matching sessions, in nano-credits.
        UsageCounters:
            type: object
            required:
                - input_tokens
                - output_tokens
                - cache_read_input_tokens
                - cache_creation_input_tokens
            properties:
                input_tokens:
                    type: integer
                output_tokens:
                    type: integer
                cache_read_input_tokens:
                    type: integer
                cache_creation_input_tokens:
                    type: integer
        SessionUsage:
            allOf:
                - $ref: "#/components/schemas/UsageCounters"
                - type: object
                  required:
                    - credits_nano
                  properties:
                    credits_nano:
                        type: integer
                        description: Cumulative billing total in nano-credits (billionths of a credit)
        RunUsage:
            allOf:
                - $ref: "#/components/schemas/UsageCounters"
                - type: object
                  required:
                    - credits_nano
                  properties:
                    credits_nano:
                        type: integer
                        description: Billing total for this single run cycle, in nano-credits (billionths of a credit)
        SessionEvent:
            type: object
            required:
                - id
                - type
                - content
            properties:
                id:
                    type: string
                type:
                    type: string
                    description: >-
                        Event type. Input events you send include user.message, system.message, user.tool_result, and user.interrupt. As the agent responds, the session also produces agent.message replies, agent.tool_use when the agent calls a tool, and status events: session.status_running, session.status_idle, and session.error. The session may also produce session.compaction events: when the conversation approaches the model's context window, the oldest turns are summarized into a session.compaction event whose content is a single text block (the summary). Original events are retained; the summary only changes what the model is replayed on subsequent turns. Finally, each kept agentic-loop turn produces a session.turn_usage event reporting that turn's token usage.
                    enum:
                        - user.message
                        - user.tool_result
                        - user.interrupt
                        - system.message
                        - agent.message
                        - agent.tool_use
                        - session.status_running
                        - session.status_idle
                        - session.error
                        - session.compaction
                        - session.turn_usage
                content:
                    type: array
                    description: >-
                        Array of content blocks. For user.message, system.message, and agent.message these are message content blocks (for example text, image, or document). For agent.tool_use the blocks are tool_use objects with type, id, name, and input fields. For user.tool_result they are tool_result objects with tool_use_id, content, and is_error; a failed one additionally carries error_code (the same bounded value as the event-level error_code field) and a content body holding a JSON error envelope — an object with a single "error" key whose value has code, message, an optional field naming the offending argument when exactly one is at fault, and retryable indicating whether repeating the identical call may succeed. Reading the envelope rather than the prose is what lets a consumer distinguish "correct this argument" from "try again in a moment". A successful tool_result the gateway answered itself may instead carry status, currently only tool_loaded: the model named a tool that was declared on its agent but not yet in its tool list, so the tool was loaded and nothing was executed for that block. The model's real call to the same tool follows on a later turn, so a consumer rendering a transcript can present the pair as loading that tool rather than as one call made twice. status is absent from every ordinary tool_result. For user.interrupt, content is an empty array. For session.status_idle the content carries a stop_reason: end_turn when the turn completed, user_cancelled when a user.interrupt stopped the run, or client_tool_use when the run paused waiting for the client to execute a tool; when stop_reason is client_tool_use, the content also carries a tool_use_ids array listing the pending client tool call IDs. When stop_reason is client_tool_use, the content may also carry tool_traceparents: a map from each pending tool_use_id to a W3C traceparent the client can echo on tool_result for session trace correlation (optional; absent on older gateways). The content also carries context_tokens: the total token count (input + output) of the run's most recent turn, reflecting the session's current context footprint (since each turn resends the full history as input) — useful for warning a user before the conversation approaches the model's context window. context_tokens is always present, including 0 when the cycle made no model request. It remains supported. The latest session.turn_usage event's total_tokens is that last kept turn's own footprint, with the rest of that turn's usage alongside it, and is the better source for a new integration. After a cycle that compacted, idle context_tokens is the post-compaction estimate instead — the turn event is not rewritten. For session.turn_usage the content is a single block reporting one kept agentic-loop turn's usage as that turn's model request completed: turn (the turn's position in the run, from 1), model (the model that served it), input_tokens, output_tokens, cache_read_input_tokens, cache_creation_input_tokens, reasoning_tokens, total_tokens, and credits_nano. Providers do not separate tool-call and tool-result tokens from the prompt and completion counts, so neither does this shape. credits_nano here prices that kept request and is informational: a run cycle is charged once, and the charge is the credits_nano in the usage object on the cycle's session.status_idle or session.error event. Summing the per-turn figures can differ from that charge by rounding and by tokens spent on a citation rescue retry that did not become a kept turn. When a turn stopped early (it reached the output limit or the context limit, the model's response was blocked by a content filter, it came back empty, or the user cancelled it) and dropped content as a result, the block also carries a discarded object listing what was dropped: reason (max_tokens, context_exceeded, content_blocked, empty_response, or cancelled), block_count (how many blocks were dropped), and blocks (the last 20 of them: content blocks in turn order, then any tool calls the provider stream cut off), each with type (for example tool_use or thought), tool (the tool name, on tool_use blocks only, up to 128 characters) and chars (its approximate size in characters, not comparable across providers or between complete and cut-off blocks). It lists types, tool names and sizes only, never the content, and is absent when the turn dropped nothing. For session.error the content carries a single block with type "error", a client-safe text message, a machine-readable code: upstream_error (the model provider returned an error), rate_limit_error (the model provider is temporarily rate limited), context_exceeded (the conversation exceeded the model's context window and automatic compaction could not recover), upstream_timeout (the model provider took too long to respond), max_iterations (the agent exhausted its model-turn budget without completing the task; retry with a smaller task), max_tokens (the model hit its output limit; any partial agent.message precedes the error), empty_response (the model produced no user-visible content after bounded retries), content_policy_violation (the model could not produce a response because it may conflict with the content policy), invalid_tool_schema (the model rejected a tool definition for this session; retrying the same model often fails), toolset_incomplete (the agent declares tools the gateway could not resolve — for example a knowledge_base collection that no longer exists; the run is stopped rather than continued with a partial toolset, and retrying will not help until the agent's tools[] is corrected), run_timeout (the run's overall time budget expired before the agent finished; send the message again, ideally as a smaller task), run_interrupted (the run was cut short before it finished; send the message again), run_abandoned (the run's worker was lost before it finished and the run was settled afterwards; send the message again), or internal_error (an unexpected failure on our side); and an optional request_id correlating the failure with support-facing logs, present whenever one could be resolved for the request that triggered it. For session.compaction the content is a single text block (the summary) — original events are retained; the summary only changes what the model is replayed on subsequent turns.

                        When the request passed include_thinking=true, an agent.message produced with reasoning_effort set may begin with a thought block: type "thought", a text field holding the model's reasoning summary, and optionally extra_content.gateway.thinking_ms — the measured reasoning duration in milliseconds. Models that reason without exposing the text yield thought blocks with an empty text field and only the duration metadata. Without include_thinking (the default), thought blocks are omitted from event content.

                        On an agent.message reply grounded in a knowledge base, text blocks may carry a `citations` array listing KB source documents the model referenced. Each citation is an object with `type` (string discriminator — `"knowledge_base"` today; new source kinds may add values in the future), `document_uri` (string, the click-through URL) and `document_title` (string, the human-readable label). The array is optional, including when the reply is based on retrieved content. Consumers rendering a bottom-of-message Sources list should walk all text blocks, dedupe by `document_uri`, and render one link per unique source.

                        Citations provide answer-level attribution, not verification of individual claims. Consumers should read the final event's citations rather than treating all retrieved documents as answer sources.
                    items:
                        type: object
                processed_at:
                    type: string
                    format: date-time
                    nullable: true
                usage:
                    allOf:
                        - $ref: "#/components/schemas/RunUsage"
                    nullable: true
                    description: >-
                        Tokens and credits consumed by the run cycle that produced this event. Present only on session.status_idle and session.error — the two events every run cycle ends in — and reflects that run's aggregated usage across all of its turns, including any usage billed before a mid-run failure. This is the charge for the run, including tokens spent on a citation rescue retry that is not listed on session.turn_usage. session.turn_usage reports each kept turn inside its content and never carries a usage object of its own, so counting this field across a session never double-counts.
                error_code:
                    type: string
                    description: >-
                        Machine-readable classification of the failure this event reports, repeating at the event level the code its failing content block already carries — so a client can branch on the outcome without walking the blocks. Present only on an event that reports a failure: a session.error (where the value is the run-failure code from that event's error block) or a user.tool_result whose tool_result block failed (where it is that block's error_code). Absent on every successful event. When an event answers several tool calls and more than one failed, the first failing block's code is reported. A failure that arrived without a code is reported as "unclassified".
                    enum:
                        - invalid_input
                        - permission_denied
                        - not_found
                        - tool_unavailable
                        - declined
                        - cancelled
                        - rate_limited
                        - timeout
                        - unavailable
                        - wp_fatal_error
                        - execution_failed
                        - internal_error
                        - retry_refused
                        - unclassified
                        - upstream_error
                        - rate_limit_error
                        - context_exceeded
                        - upstream_timeout
                        - attachment_unsupported
                        - invalid_tool_schema
                        - insufficient_credits
                        - entitlement_required
                        - entitlement_unavailable
                        - toolset_incomplete
                        - profile_unavailable
                        - run_not_scheduled
                        - max_iterations
                        - max_tokens
                        - empty_response
                        - content_policy_violation
                        - run_timeout
                        - run_interrupted
                        - run_abandoned
        SessionTerminatedEvent:
            type: object
            required:
                - reason
            properties:
                reason:
                    type: string
                    description: >-
                        Why the stream ended for good. The session will produce no further events, so do not reconnect.
                    enum:
                        - session_archived
        EventStartPreview:
            type: object
            required:
                - id
            properties:
                id:
                    type: string
                    description: >-
                        The id the buffered event will carry. The preview opens on the first text delta, before the turn is known to end as an agent.message or an agent.tool_use, so no event type is given — reconcile on this id alone.
        EventStartEvent:
            type: object
            required:
                - type
                - event
            properties:
                type:
                    type: string
                    enum:
                        - event_start
                event:
                    $ref: "#/components/schemas/EventStartPreview"
                replaces:
                    type: string
                    description: >-
                        When present, the id of an earlier previewed event this start retracts. The message that streamed under that id was abandoned and will never be delivered as a whole event, so clients must discard its buffered preview.
        EventDeltaText:
            type: object
            required:
                - type
                - text
            properties:
                type:
                    type: string
                    enum:
                        - text
                text:
                    type: string
                    description: Incremental text to append to content[index].text.
        EventContentDelta:
            type: object
            required:
                - type
                - index
                - content
            properties:
                type:
                    type: string
                    enum:
                        - content_delta
                index:
                    type: integer
                    description: Which entry in the previewed event's content array this fragment extends.
                content:
                    $ref: "#/components/schemas/EventDeltaText"
        EventDeltaEvent:
            type: object
            required:
                - type
                - event_id
                - delta
            properties:
                type:
                    type: string
                    enum:
                        - event_delta
                event_id:
                    type: string
                    description: The id of the agent.message this fragment previews.
                delta:
                    $ref: "#/components/schemas/EventContentDelta"
        EventThinkingDeltaText:
            type: object
            required:
                - type
                - text
            properties:
                type:
                    type: string
                    enum:
                        - thinking
                text:
                    type: string
                    description: >-
                        Incremental reasoning-summary text to append to the thought block at content[index] on the previewed event.
        EventThinkingContentDelta:
            type: object
            required:
                - type
                - index
                - content
            properties:
                type:
                    type: string
                    enum:
                        - content_delta
                index:
                    type: integer
                    description: Which entry in the previewed event's content array this fragment extends.
                content:
                    $ref: "#/components/schemas/EventThinkingDeltaText"
        EventThinkingDeltaEvent:
            type: object
            description: >-
                One reasoning-summary fragment of a previewed agent.message. Sent only on connections that passed both event_deltas and include_thinking=true. Identical framing to event_delta — concatenating fragments in arrival order for a given (event_id, index) yields a prefix of the thought block's text on the buffered event.
            required:
                - type
                - event_id
                - delta
            properties:
                type:
                    type: string
                    enum:
                        - event_thinking_delta
                event_id:
                    type: string
                    description: The id of the agent.message this fragment previews.
                delta:
                    $ref: "#/components/schemas/EventThinkingContentDelta"
        EventThinkingDoneEvent:
            type: object
            description: >-
                The previewed agent.message's reasoning phase ended. Sent once per previewed message, only on connections that passed both event_deltas and include_thinking=true, before the visible reply streams. For models that reason without exposing text this is the only live reasoning signal; the same duration also appears on the durable thought block's extra_content.gateway.thinking_ms.
            required:
                - type
                - event_id
                - thinking_ms
            properties:
                type:
                    type: string
                    enum:
                        - event_thinking_done
                event_id:
                    type: string
                    description: The id of the agent.message whose reasoning ended.
                thinking_ms:
                    type: integer
                    description: The measured reasoning duration in milliseconds.
        SendEventsRequest:
            type: object
            required:
                - events
            description: >-
                Events to append to the session. A user.interrupt must be the only event in the request.
            oneOf:
                - title: Message or tool-result events
                  type: object
                  required:
                    - events
                  properties:
                    events:
                        type: array
                        minItems: 1
                        maxItems: 100
                        items:
                            type: object
                            required:
                                - type
                                - content
                            properties:
                                type:
                                    type: string
                                    enum: [user.message, system.message, user.tool_result]
                                    description: >-
                                        Event type. user.message and system.message send text/document content. user.tool_result sends tool execution results for client tools the model called, resuming a paused run.
                                client_submission_id:
                                    type: string
                                    format: uuid
                                    description: >-
                                        Optional canonical UUID, supported only for a single user.message. Retrying identical logical content in the same session returns the previously committed events without starting another turn, even if session pending state has changed. Reusing the key with different content returns 409.
                                content:
                                    type: array
                                    minItems: 1
                                    description: >-
                                        Array of content blocks. For user.message and system.message, these are text/document blocks. For user.tool_result, each block is a tool_result object (see ToolResultBlock).
                                    items:
                                        anyOf:
                                            - $ref: "#/components/schemas/ToolResultBlock"
                                            - type: object
                                              description: A user.message or system.message content block.
                - title: Interrupt event
                  type: object
                  required:
                    - events
                  properties:
                    events:
                        type: array
                        minItems: 1
                        maxItems: 1
                        items:
                            type: object
                            required:
                                - type
                            properties:
                                type:
                                    type: string
                                    enum: [user.interrupt]
                                    description: >-
                                        Requests cancellation of the exact run currently in flight, never starts a run, and has no effect beyond being appended when no run is in flight.
                                content:
                                    type: array
                                    maxItems: 0
                                    description: Omit content or send an empty array.
                                    items:
                                        type: object
        ClientToolTiming:
            type: object
            required:
                - started_at_ms
                - ended_at_ms
            properties:
                started_at_ms:
                    type: integer
                    format: int64
                    description: Unix time in milliseconds when client-side execution started.
                ended_at_ms:
                    type: integer
                    format: int64
                    description: Unix time in milliseconds when client-side execution ended.
        ToolResultBlock:
            type: object
            required:
                - type
                - tool_use_id
            properties:
                type:
                    type: string
                    enum: [tool_result]
                tool_use_id:
                    type: string
                    description: The tool_use id this result answers.
                content:
                    description: >-
                        Tool output as a string, or a JSON error envelope on failure. Optional; omitted when the client has nothing to report besides is_error.
                is_error:
                    type: boolean
                    description: True when the client tool call failed.
                error_code:
                    type: string
                    description: >-
                        Machine-readable classification of a failure. Present only when is_error is true. One of invalid_input, permission_denied, not_found, tool_unavailable, declined, cancelled, rate_limited, timeout, unavailable, wp_fatal_error, execution_failed, or internal_error. cancelled is also what the gateway itself writes when a new message auto-resolves a stale pause. retry_refused is reserved for the gateway and rejected with 400. An unrecognised value is rejected with 400, as is an error_code on a block whose is_error is not true. Omitting error_code on a failure is accepted for backward compatibility; the failure is then counted as unclassified.
                traceparent:
                    type: string
                    description: >-
                        W3C traceparent echoed from the matching session.status_idle tool_traceparents entry. Optional. Not returned in later event history.
                client_timing:
                    $ref: "#/components/schemas/ClientToolTiming"
        SendEventsResponse:
            type: object
            required:
                - data
            properties:
                data:
                    type: array
                    items:
                        $ref: "#/components/schemas/SessionEvent"
        ListEventsResponse:
            type: object
            required:
                - data
            properties:
                data:
                    type: array
                    items:
                        $ref: "#/components/schemas/SessionEvent"
                next_page:
                    type: string
                    description: Opaque cursor for next page.
        CreateFeedbackRequest:
            type: object
            required:
                - rating
            properties:
                rating:
                    type: boolean
                    description: >-
                        true for a thumbs-up, false for a thumbs-down. Required — an omitted rating is rejected rather than defaulted, so a thumbs-down is never recorded by accident.
                message:
                    type: string
                    nullable: true
                    maxLength: 2000
                    description: >-
                        Optional free-text comment. Stored as plain text, with the comment's own meaning preserved: tabs and line breaks are kept (every spelling of a line break — CRLF, CR, U+2028, U+2029 — is stored as a newline), while the control characters that are not whitespace and a bounded set of format characters that misrepresent the surrounding text (the bidi overrides and isolates U+202A–U+202E and U+2066–U+2069, the zero-width space U+200B, and the byte-order mark U+FEFF) are removed. Other invisible characters are kept, including the joiners that hold emoji sequences together and are ordinary orthography in several scripts. Unicode is then normalized (NFC) and surrounding whitespace is trimmed. A comment that is empty after that is stored as no comment at all. A comment longer than 2000 characters is rejected rather than truncated. Markup is never stripped: what is stored stays untrusted text, and each consumer must apply the output encoding its own rendering context calls for.
        FeedbackResponse:
            type: object
            required:
                - response_event_id
                - rating
                - created_at
            properties:
                response_event_id:
                    type: string
                    description: The agent.message event this feedback is about.
                rating:
                    type: boolean
                    description: true for a thumbs-up, false for a thumbs-down.
                message:
                    type: string
                    nullable: true
                    description: >-
                        The comment as stored, or null when none was given. Always present so "rated without a comment" is unambiguous.
                created_at:
                    type: string
                    format: date-time
                    description: When the feedback was recorded.
        CreateProjectRequest:
            type: object
            required:
                - name
            properties:
                name:
                    type: string
                    maxLength: 255
                    description: >-
                        Human-readable project name. Trimmed of surrounding whitespace and must be unique within the account.
        ProjectResponse:
            type: object
            required:
                - id
                - account_id
                - name
                - created_at
                - updated_at
            properties:
                id:
                    type: string
                account_id:
                    type: string
                name:
                    type: string
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
        ListProjectsResponse:
            type: object
            required:
                - projects
            properties:
                projects:
                    type: array
                    items:
                        $ref: "#/components/schemas/ProjectResponse"
        PermissionLevel:
            type: string
            enum: [none, read, write]
            description: Access level for a scope. write is a superset of read.
        PermissionScopes:
            type: object
            description: >-
                Per-scope access levels. Required when preset is "restricted", where every scope must be present with a valid level. Ignored on requests for the "all" and "read_only" presets (levels are derived server-side); on responses, scopes is populated only when preset is "restricted".
            properties:
                documents:
                    $ref: "#/components/schemas/PermissionLevel"
                collections:
                    $ref: "#/components/schemas/PermissionLevel"
                search:
                    $ref: "#/components/schemas/PermissionLevel"
                chat:
                    $ref: "#/components/schemas/PermissionLevel"
                image:
                    $ref: "#/components/schemas/PermissionLevel"
                speech:
                    $ref: "#/components/schemas/PermissionLevel"
                transcribe:
                    $ref: "#/components/schemas/PermissionLevel"
                agents:
                    $ref: "#/components/schemas/PermissionLevel"
                session_events:
                    $ref: "#/components/schemas/PermissionLevel"
                mcp:
                    $ref: "#/components/schemas/PermissionLevel"
        PermissionsRequest:
            type: object
            required:
                - preset
            properties:
                preset:
                    type: string
                    enum: [all, restricted, read_only]
                    description: >-
                        Named permission set. "all" grants write to every scope, "read_only" grants read to every scope, and "restricted" uses the explicit per-scope levels in `scopes`.
                scopes:
                    $ref: "#/components/schemas/PermissionScopes"
        KeyPermissionsResponse:
            type: object
            required:
                - preset
            properties:
                preset:
                    type: string
                    enum: [all, restricted, read_only]
                scopes:
                    $ref: "#/components/schemas/PermissionScopes"
        CreateKeyRequest:
            type: object
            required:
                - name
                - permissions
            properties:
                name:
                    type: string
                    description: Human-readable name for the key.
                    maxLength: 255
                type:
                    type: string
                    enum: [project, personal]
                    default: project
                    description: >-
                        "project" (default) is a project-scoped service credential with no acting user. "personal" binds the key to the requesting Okta subject and is the only type from which MCP resolves an acting user; it requires the personal-api-keys feature.
                permissions:
                    $ref: "#/components/schemas/PermissionsRequest"
        UpdateKeyRequest:
            type: object
            description: Partial update. Omitted fields are left unchanged.
            properties:
                name:
                    type: string
                    maxLength: 255
                permissions:
                    $ref: "#/components/schemas/PermissionsRequest"
        UpdateFeatureToggleRequest:
            type: object
            required:
                - enabled
            properties:
                enabled:
                    type: boolean
                    description: The caller's new preference for this feature.
        KeyResponse:
            type: object
            required:
                - key_id
                - name
                - secret_prefix
                - status
                - type
                - permissions
                - created_at
                - created_by
            properties:
                key_id:
                    type: string
                name:
                    type: string
                secret_prefix:
                    type: string
                    description: Non-secret prefix of the key, safe to display for identification.
                status:
                    type: string
                    enum: [active, revoked]
                type:
                    type: string
                    enum: [project, personal]
                permissions:
                    $ref: "#/components/schemas/KeyPermissionsResponse"
                created_at:
                    type: string
                    format: date-time
                last_used_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: When the key last authenticated a request. Null if never used.
                created_by:
                    type: string
                    description: Subject that created the key.
                owner_subject:
                    type: string
                    description: Okta subject the key is bound to. Present only for personal keys.
        CreateKeyResponse:
            allOf:
                - $ref: "#/components/schemas/KeyResponse"
                - type: object
                  required:
                    - secret
                  properties:
                    secret:
                        type: string
                        description: >-
                            The plaintext API key secret. Returned only once, at creation, and never retrievable afterward.
        ListKeysResponse:
            type: object
            required:
                - keys
            properties:
                keys:
                    type: array
                    items:
                        $ref: "#/components/schemas/KeyResponse"
        DeletedKeyResponse:
            type: object
            required:
                - deleted
            properties:
                deleted:
                    type: boolean
                    enum: [true]
