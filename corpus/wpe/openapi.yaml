                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "402":
                    $ref: "#/components/responses/InsufficientCredits"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    description: >-
                        Conflict. The batch contains only distinct tool_result IDs already cancelled because a message resolved their pause. This applies even when newer tool calls are pending. None of the submitted events are persisted. Discard these obsolete results and do not retry them. Unknown or duplicate IDs and batches mixing cancelled results with current results or messages instead return 400. Also returned when the session was created through the v2 API; continue it with POST /v2/sessions/{session_id}/events.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "502":
                    description: >-
                        Content moderation is temporarily unavailable, with error type "moderation_unavailable". The event was not persisted. Retry after a short delay.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
    /v1/sessions/{session_id}/responses/{response_event_id}/feedback:
        get:
            x-publish-external-docs: true
            summary: Get response feedback
            description: >-
                Returns the feedback recorded for a single agent response. Responds with 404 when the response has not been rated, which is the normal case for most responses — treat it as "no rating yet" rather than an error. Accepts a service-token bearer authenticating a site or an API key, either of which must be authorized for the session's project, or a browser session token holding the session_events scope (bound to the session's agent and, when the session records an owner_id, to that same visitor).
            operationId: getResponseFeedback
            tags:
                - Sessions
            security:
                - bearerAuth: []
            parameters:
                - name: session_id
                  in: path
                  required: true
                  description: The session ID.
                  schema:
                    type: string
                - name: response_event_id
                  in: path
                  required: true
                  description: >-
                    The id of the agent.message event being rated, as returned by GET /v1/sessions/{session_id}/events.
                  schema:
                    type: string
            responses:
                "200":
                    description: The feedback recorded for this response
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/FeedbackResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "429":
                    $ref: "#/components/responses/RateLimited"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
        post:
            x-publish-external-docs: true
            summary: Record response feedback
            description: >-
                Records a thumbs-up or thumbs-down, with an optional comment, on a single agent response. response_event_id must name an agent.message event belonging to the session in the path; any other event type is rejected with 400. Feedback is immutable once recorded. Repeating the identical request succeeds with 200 so a client that retries a lost response is not punished for it, but changing a recorded rating or comment is rejected with 409. This endpoint consumes no credits. Accepts a service-token bearer authenticating a site or an API key, either of which must be authorized for the session's project, or a browser session token holding the session_events scope (bound to the session's agent and, when the session records an owner_id, to that same visitor).
            operationId: createResponseFeedback
            tags:
                - Sessions
            security:
                - bearerAuth: []
            parameters:
                - name: session_id
                  in: path
                  required: true
                  description: The session ID.
                  schema:
                    type: string
                - name: response_event_id
                  in: path
                  required: true
                  description: >-
                    The id of the agent.message event being rated, as returned by GET /v1/sessions/{session_id}/events.
                  schema:
                    type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateFeedbackRequest"
            responses:
                "200":
                    description: >-
                        Feedback identical to what was already recorded; nothing changed.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/FeedbackResponse"
                "201":
                    description: Feedback recorded
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/FeedbackResponse"
                "400":
                    $ref: "#/components/responses/BadRequest"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
                "404":
                    $ref: "#/components/responses/NotFound"
                "409":
                    description: >-
                        Conflict. Feedback has already been recorded for this response with a different rating or comment, and recorded feedback cannot be changed.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "413":
                    $ref: "#/components/responses/RequestTooLarge"
                "429":
                    $ref: "#/components/responses/RateLimited"
                "500":
                    $ref: "#/components/responses/InternalServerError"
                "503":
                    $ref: "#/components/responses/ServiceUnavailable"
components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            description: >-
                Accepts three token types: (1) JWT access token verified against the configured JWKS endpoint; (2) WP Engine API key (prefixed "wpe_"); (3) browser session token (prefixed "wpbs_") — short-lived tokens minted for browser clients via POST /v1/browser/client_secret. Per-route permission checks apply to API keys and browser session tokens; some management endpoints are JWT-only, while agents, sessions, and events also accept an API key scoped to a project. A WordPress site access token must carry the scope "urn:wpengine:wordpress"; the pre-URN spelling "wpengine:wordpress" is also accepted, so sites registered before the rename continue to work without re-registering. A token carrying neither is rejected with 403.
        internalServiceAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: >-
                Google-issued ID token for an authorized service account.
        anthropicApiKey:
            type: apiKey
            in: header
            name: x-api-key
            description: >-
                WP Engine API key sent via the Anthropic SDK convention. Equivalent to presenting the same key as a bearer token. Supported only on the /v1/messages endpoints.
        metronomeSignature:
            type: apiKey
            in: header
            name: Metronome-Webhook-Signature
            description: >-
                Hex-encoded HMAC-SHA256 of the X-Metronome-Date value, a newline, and the raw request body, keyed with the webhook signing secret.
    responses:
        BadRequest:
            description: >-
                Invalid request body or parameters. On agent create and update, error type "profile_unavailable" means the requested profile is not available to the caller.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        Unauthorized:
            description: Missing or invalid bearer token
            headers:
                WWW-Authenticate:
                    schema:
                        type: string
                        example: Bearer realm="ai-services"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        Forbidden:
            description: >-
                The token is valid, but the request is forbidden. Error type "permission_error" means the token's scope/permission is insufficient or the authenticated user is not authorized for the target account; "entitlement_required" means the account lacks the required product entitlement; and "account_required" means no billing account could be resolved. On /v1/chat/completions when content moderation is enabled, and on /v1/sessions/{session_id}/events, error type "content_policy_violation" instead means the request content was blocked by content moderation policy; that response never identifies which filter or category matched.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        NotFound:
            description: The requested resource was not found
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        Conflict:
            description: The request conflicts with an existing resource
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        KnowledgeBaseUnavailable:
            description: >-
                The knowledge base is not currently available. Retry after a short delay.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        RequestTooLarge:
            description: Request body exceeds the 64 KiB limit
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        ConsentRequestTooLarge:
            description: Request body exceeds the 8 KiB consent-payload limit.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        ServiceUnavailable:
            description: >-
                A required dependency is temporarily unavailable. Retry after a short delay with exponential back-off. An entitlement lookup failure uses error type "entitlement_unavailable".
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        RateLimited:
            description: >-
                Rate limit exceeded. The request was throttled at the edge; wait and retry later. The response body is a short HTML page generated by the load balancer, not a structured JSON error — clients should rely on the 429 status code rather than parsing the body.
            content:
                text/html:
                    schema:
                        type: string
        InternalServiceRateLimited:
            description: >-
                The authenticated internal service exceeded its request-per-minute limit. Wait for the indicated interval before retrying.
            headers:
                Retry-After:
                    description: Number of seconds to wait before retrying.
                    schema:
                        type: integer
                    example: 60
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        AnthropicInternalServiceRateLimited:
            description: >-
                The authenticated internal service exceeded its request-per-minute limit. The body uses Anthropic's rate_limit_error envelope. Wait for the indicated interval before retrying.
            headers:
                Retry-After:
                    description: Number of seconds to wait before retrying.
                    schema:
                        type: integer
                    example: 60
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/AnthropicErrorResponse"
        InsufficientCredits:
            description: >-
                The account's credit balance is exhausted. Grant or top up credits before retrying. Distinct from 429, which is edge rate limiting.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        BadGateway:
            description: Upstream provider returned an error
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        InternalServerError:
            description: >-
                The server encountered an unexpected error while handling the request. Safe to retry once; if it persists, the cause is server-side and the request payload was not the problem.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        UpstreamPassthrough:
            description: >-
                Upstream provider error passed through with its original status code and response body. The shape may vary by provider.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        AnthropicBadRequest:
            description: >-
                Invalid request body or parameters, in Anthropic error envelope format (error type "invalid_request_error").
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/AnthropicErrorResponse"
        AnthropicUnauthorized:
            description: >-
                Missing or invalid credentials, in Anthropic error envelope format (error type "authentication_error").
            headers:
                WWW-Authenticate:
                    schema:
                        type: string
                        example: Bearer realm="ai-services"
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/AnthropicErrorResponse"
        AnthropicForbidden:
            description: >-
                Valid credentials but insufficient permission, in Anthropic error envelope format (error type "permission_error"). On /v1/messages, when content moderation is enabled, a 403 with error type "content_policy_violation" instead means the request content was blocked by content moderation policy; that response never identifies which filter or category matched.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/AnthropicErrorResponse"
        AnthropicInsufficientCredits:
            description: >-
                The account's credit balance is exhausted. Grant or top up credits before retrying. Body is in Anthropic error envelope format.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/AnthropicErrorResponse"
        AnthropicNotFound:
            description: >-
                The requested model was not found or does not support this endpoint, in Anthropic error envelope format (error type "not_found_error").
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/AnthropicErrorResponse"
        AnthropicRequestTooLarge:
            description: >-
                Request body exceeds the size limit, in Anthropic error envelope format (error type "request_too_large").
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/AnthropicErrorResponse"
        AnthropicBadGateway:
            description: >-
                Upstream provider returned an error, in Anthropic error envelope format (error type "api_error").
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/AnthropicErrorResponse"
        AnthropicServiceUnavailable:
            description: >-
                A required dependency (such as the authorization service) is temporarily unavailable, in Anthropic error envelope format (error type "overloaded_error"). Retry after a short delay with exponential back-off.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/AnthropicErrorResponse"
        AnthropicUpstreamError:
            description: >-
                Upstream provider error relayed with its original status code and translated into Anthropic error envelope format. The error type reflects the status code (e.g. "rate_limit_error" for 429, "overloaded_error" for 529).
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/AnthropicErrorResponse"
        AIReadinessBadRequest:
            description: >-
                The request is invalid. `error_code` says why: `invalid_request` (the body is not one JSON object with a `url` string and optional `categories`; POST scan), `invalid_url` (the URL is not a public `https` URL, or is not the site's home page because it has a path or query; POST scan), `invalid_categories` (an unknown category; POST scan), `target_not_allowed` (the site is one this service does not scan: a WP Engine service host, or a site whose owner opted out; POST scan), `invalid_check_ids` (a `check_id` that is unknown, outside the scan or needs no action; fix prompt), `client_ip_unavailable` (the client address could not be determined; every route). On POST scan, User Portal authentication also answers 400 for a missing `WPEngine-Account` header; that error comes from the shared authentication layer and carries no `error_code`.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        AIReadinessUnauthorized:
            description: >-
                Authentication failed (POST scan only). `error_code`: `invalid_authorization` (more than one Authorization header) or `authentication_required` (the token is not a User Portal login for a customer account). A missing, malformed, invalid or expired User Portal JWT is rejected by the shared authentication layer, with a `WWW-Authenticate` header and no `error_code`.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        AIReadinessForbidden:
            description: >-
                Not allowed (POST scan only). User Portal authentication answers 403, without an `error_code`, for a token without the `accounts:rw` scope, an account the user may not access, a WP Engine API key (`wpe_`) or a browser session token (`wpbs_`).
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        AIReadinessNotFound:
            description: >-
                `error_code: scan_not_found`: no publicly shareable scan has this ID. Malformed IDs and earlier private scans are reported the same way.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        AIReadinessConflict:
            description: >-
                `error_code: scan_not_completed`: the scan is pending or failed, so it has no results to act on yet.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        AIReadinessRateLimited:
            description: >-
                Too many requests. `error_code: rate_limited` when the per-IP request rate is exceeded (every route), with `Retry-After: 1`; `error_code: daily_quota_exceeded` when the daily scan quota is used up (POST scan), with `Retry-After` set to the seconds until the quota resets at midnight UTC; `error_code: capacity_full` when every scan worker is busy and the queue is full (POST scan), with `Retry-After: 15`. A full queue means the service is working but busy, so it is reported as 429 rather than 503; no scan ID is returned and the daily quota already reserved for the request is not returned. `error_code: scan_in_progress` when a scan of the same site is already running (POST scan), with `Retry-After: 15`. `error_code: site_rate_limited` when the site has had 10 scans started in the current clock hour, whoever asked for them (POST scan), with `Retry-After` set to the seconds until the hour ends. `error_code: scan_budget_exhausted` when the service has started its daily share of scans across every caller (POST scan), with `Retry-After` set to the seconds until midnight UTC. A site is its registrable domain, so `www.example.co.uk` and `shop.example.co.uk` count as one site, while each WP Engine hosted install (such as `mysite.wpengine.com` or `mysite.wpenginepowered.com`) is its own site. None of `scan_in_progress`, `site_rate_limited` or `scan_budget_exhausted` spends the caller's daily scan quota.
            headers:
                Retry-After:
                    description: "Seconds to wait: 1 for `rate_limited`, the seconds until midnight UTC for `daily_quota_exceeded`, 15 for `capacity_full` and `scan_in_progress`, the seconds until the hour ends for `site_rate_limited`, the seconds until midnight UTC for `scan_budget_exhausted`."
                    schema:
                        type: integer
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        AIReadinessUnavailable:
            description: >-
                A dependency is unavailable. `error_code: dependency_unavailable` when the quota, rate-limit or scan-limit store cannot be reached (every route), with `Retry-After: 60`. User Portal authentication can also answer 503 when account authorization is unavailable, without an `error_code` or `Retry-After`. A busy service answers 429 `capacity_full` instead.
            headers:
                Retry-After:
                    description: "Seconds to wait: 60 for `dependency_unavailable`."
                    schema:
                        type: integer
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        AIReadinessInternalError:
            description: >-
                `error_code: internal_error`: an unexpected server error. The message never includes internal detail.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
        AIReadinessNotImplemented:
            description: >-
                `error_code: not_implemented`: draft generation is not available yet.
            content:
                application/json:
                    schema:
                        $ref: "#/components/schemas/ErrorResponse"
    schemas:
        AIReadinessEvidence:
            type: object
            additionalProperties: false
            description: >-
                A bounded observation supporting its enclosing check, not a full request trace or an artifact for re-scoring. Facts are allowlisted by kind. Media types exclude parameters. No raw headers, bodies, cookies or credentials are returned. HTTP 200 alone does not establish validation. Reserved: no check returns evidence yet.
            required:
                - kind
                - source
                - url
            properties:
                kind:
                    type: string
                    description: >-
                        Open. Known values: `http_response`, `http_request_error`, `robots_txt_validation`, `content_negotiation`, `sitemap_validation`, `structured_data`, `indexing_directives`.
                source:
                    type: string
                    enum:
                        - direct
                        - provider
                observed_at:
                    type: string
                    format: date-time
                    description: Actual observation time; absent when unavailable, never inferred from scan completion.
                url:
                    type: string
                    format: uri
                    maxLength: 2048
                    description: >-
                        Relevant document or final attempted HTTP URL without credentials, query or fragment. Evidence whose URL exceeds 2048 bytes is not reported at all (never cut short), and the check's `evidence_truncated` is then true.
                method:
                    type: string
                    enum:
                        - GET
                        - HEAD
                        - POST
                        - PUT
                        - PATCH
                        - DELETE
                        - OPTIONS
                        - CONNECT
                        - TRACE
                    description: Actual HTTP method, when retained.
                http_status:
                    type: integer
                    minimum: 100
                    maximum: 999
                    description: Absent when no HTTP response status was captured.
                content_type:
                    type: string
                    maxLength: 256
                    description: Observed response media type, when available.
                user_agent:
                    type: string
                    maxLength: 256
                    description: Explicitly tested user agent, when available; not proof of access from that agent's network.
                valid_format:
                    type: boolean
                    description: robots_txt_validation only; the checker recognized a valid robots.txt structure.
                requested_content_type:
                    type: string
                    maxLength: 256
                    description: content_negotiation only; media type actually requested.
                response_content_type:
                    type: string
                    maxLength: 256
                    description: content_negotiation only; response media type, when available.
                vary_accept:
                    type: boolean
                    description: content_negotiation only; whether the response varied on Accept.
                xml_valid:
                    type: boolean
                    description: sitemap_validation only; complete sitemap XML validation succeeded or failed within read limits.
                is_index:
                    type: boolean
                    description: sitemap_validation only; whether validated XML is a sitemap index.
                child_sitemaps_checked:
                    type: boolean
                    description: sitemap_validation only; whether child sitemaps of this index were checked.
                structured_data_types:
                    type: array
                    maxItems: 16
                    items:
                        type: string
                        maxLength: 256
                    description: structured_data only; sorted, distinct JSON-LD types observed.
                parse_error_count:
                    type: integer
                    minimum: 0
                    description: structured_data only; number of JSON-LD blocks that could not be parsed.
                directives:
                    type: array
                    maxItems: 16
                    items:
                        type: string
                        maxLength: 256
                    description: indexing_directives only; recognized indexing directives, not raw meta tags or headers.
                robots_rule:
                    type: string
                    maxLength: 256
                    description: indexing_directives only; recognized wildcard rule blocking the whole site.
            oneOf:
                - properties:
                    kind:
                        enum: [http_response]
                  required: [http_status]
                - properties:
                    kind:
                        enum: [http_request_error]
                - properties:
                    kind:
                        enum: [robots_txt_validation]
                  required: [valid_format]
                - properties:
                    kind:
                        enum: [content_negotiation]
                  required: [requested_content_type]
                - properties:
                    kind:
                        enum: [sitemap_validation]
                  required: [xml_valid]
                - properties:
                    kind:
                        enum: [structured_data]
                  required: [parse_error_count]
                - properties:
                    kind:
                        enum: [indexing_directives]
        CreateAIReadinessScanRequest:
            type: object
            additionalProperties: false
            required:
                - url
            properties:
                url:
                    type: string
                    maxLength: 2048
                    description: >-
                        The public website to scan, as an `https` URL or a bare hostname, which is treated as `https`. An `http` URL or any other scheme is rejected with 400 `invalid_url`. It must be the site's home page: the path must be empty or `/` and there must be no query string (a fragment is ignored), otherwise the request is rejected with 400 `invalid_url`. It must name a public domain: IP addresses (including shortened, hex and octal forms such as `127.1`), single-label hosts, names reserved for non-public use (`.local`, `.localhost`, `.internal`, `.test`, `.invalid`, `.example`, `.arpa`, `.onion`, `.alt`, and `example.com`, `example.net` and `example.org`), credentials and explicit ports are rejected with 400. After conversion to ASCII the host may be at most 253 bytes, with no label longer than 63; one trailing dot is removed. Whitespace, control and invisible characters, backslashes, slash lookalikes and percent-encoded hosts are rejected rather than interpreted. An internationalized hostname is stored, reported and scanned only in its ASCII (punycode) form, so a lookalike host is never shown in Unicode, and a host that is not a valid domain name is rejected with 400. Error messages name the rule broken, never the submitted URL.
                    example: https://wpengine.com
                categories:
                    type: array
                    description: >-
                        Limit the scan to these check categories. Omitted, empty or naming every category scans everything. An unknown category is rejected with 400. A limited scan still counts as one scan against the daily quota.
                    items:
                        type: string
                        enum:
                            - discoverability
                            - content_accessibility
                            - structured_data
                            - bot_governance
                            - capabilities
                            - authentication
                            - agent_protocols
                            - commerce
                    example: [discoverability, bot_governance]
        AIReadinessScan:
            description: >-
                An AI readiness scan in one of its three states, told apart by `status`: pending, completed or failed. Each state lists the fields it always has.
            oneOf:
                - $ref: "#/components/schemas/AIReadinessPendingScan"
                - $ref: "#/components/schemas/AIReadinessCompletedScan"
                - $ref: "#/components/schemas/AIReadinessFailedScan"
            discriminator:
                propertyName: status
                mapping:
                    pending: "#/components/schemas/AIReadinessPendingScan"
                    completed: "#/components/schemas/AIReadinessCompletedScan"
                    failed: "#/components/schemas/AIReadinessFailedScan"
        AIReadinessPendingScan:
            description: >-
                A scan still running: its identity, scope, timestamps and `next_poll_after_seconds`. It has no results yet, so `summary`, `checks`, `guidance_notes`, `completed_at`, `failure_code` and `retryable` are absent.
            allOf:
                - $ref: "#/components/schemas/AIReadinessScanResponse"
                - type: object
                  required: [next_poll_after_seconds]
                  properties:
                    status:
                        type: string
                        enum: [pending]
        AIReadinessCompletedScan:
            description: >-
                A finished scan with results. It has `completed_at`, `summary`, `checks` and `guidance_notes`, and no `next_poll_after_seconds`, `failure_code` or `retryable`.
            allOf:
                - $ref: "#/components/schemas/AIReadinessScanResponse"
                - type: object
                  required: [completed_at, summary, checks, guidance_notes]
                  properties:
                    status:
                        type: string
                        enum: [completed]
        AIReadinessFailedScan:
            description: >-
                A scan that ended without results. It has `completed_at`, `failure_code` and `retryable`, empty `checks`, a zeroed `summary` and `guidance_notes`, and no `next_poll_after_seconds`.
            allOf:
                - $ref: "#/components/schemas/AIReadinessScanResponse"
                - type: object
                  required: [completed_at, failure_code, retryable, summary, checks, guidance_notes]
                  properties:
                    status:
                        type: string
                        enum: [failed]
                    checks:
                        type: array
                        maxItems: 0
                        items:
                            $ref: "#/components/schemas/AIReadinessCheckResult"
        AIReadinessScanResponse:
            type: object
            description: >-
                The fields of a scan in any state; see `AIReadinessScan` for which are present in each state. Value lists: a field defined with an `enum` is closed and gains no values within `v1beta1`. A field that lists known values in its description is open: clients must handle values they do not recognise, for example by showing them generically.
            required:
                - id
                - url
                - status
                - created_at
                - updated_at
                - scope
                - categories
            properties:
                id:
                    type: string
                    description: The scan's identifier.
                    example: airs_7b3kQ9xV2mN8pL4rT6wY1z
                url:
                    type: string
                    description: The URL that was scanned, normalised (lowercase host, no fragment).
                    example: https://wpengine.com/
                status:
                    type: string
                    enum:
                        - pending
                        - completed
                        - failed
                    description: >-
                        `pending` until the scan settles; then `completed` with results, or `failed` with a `failure_code`.
                scope:
                    type: string
                    description: >-
                        Open. Known value: `site_and_submitted_page`. Site-wide checks of the submitted URL's host, assessed from its home page and discovery locations; the submitted page is always the home page. Not every page or sitemap child.
                categories:
                    type: array
                    description: >-
                        The check categories this scan covers, in catalog order: the ones requested, or every category. `checks`, `summary` and `priority` cover only these categories. Open: the known values are those accepted by `CreateAIReadinessScanRequest.categories`.
                    items:
                        type: string
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                    description: >-
                        Last persisted refresh, which may include a failed provider attempt; not the time every upstream check ran. Created at insertion for legacy rows. Result freshness does not renew on a completed scan's GET.
                completed_at:
                    type: string
                    format: date-time
                    description: When the scan completed or failed. Absent while pending.
                next_poll_after_seconds:
                    type: integer
                    minimum: 1
                    example: 5
                    description: Recommended polling delay; absent on terminal scans.
                failure_code:
                    type: string
                    description: >-
                        Why the scan failed. Present only when `status` is `failed`. Open. Known values: `site_unreachable`: the website could not be reached (its hostname does not resolve or nothing answered); check the URL. `target_rejected`: the scanner refused the target, for example an invalid domain. `scanner_unavailable`: the scanner could not run or finish the scan (an outage, a rate limit, no free capacity or an interruption). `scan_incomplete`: the scan finished without readiness results. `scan_timeout`: the scan did not finish in time. `retryable` says whether submitting again may help.
                retryable:
                    type: boolean
                    description: >-
                        Present only when `status` is `failed`. True when submitting the same URL again may succeed (`scanner_unavailable`, `scan_incomplete`, `scan_timeout`); false when the URL or the site has to change first (`site_unreachable`, `target_rejected`). Unknown future codes are retryable.
                summary:
                    $ref: "#/components/schemas/AIReadinessScanSummary"
                checks:
                    type: array
                    description: >-
                        Absent while pending; empty on a failed scan. On a completed scan, every catalog check in the requested categories (all categories by default), once each, in display order.
                    items:
                        $ref: "#/components/schemas/AIReadinessCheckResult"
                guidance_notes:
                    $ref: "#/components/schemas/AIReadinessGuidanceNotes"
        AIReadinessGuidanceNotes:
            type: object
            description: >-
                Advice that applies to every solution in the report, stated once instead of in each solution.
            required: [prerequisites, constraints, verification]
            properties:
                prerequisites:
                    type: array
                    description: What to confirm before changing the site.
                    items:
                        type: string
                constraints:
                    type: array
                    description: What any change must preserve.
                    items:
                        type: string
                verification:
                    type: array
                    description: How to verify a change.
                    items:
                        type: string
        AIReadinessFixPromptResponse:
            type: object
            required: [scan_id, check_ids, prompt, estimated_tokens]
            properties:
                scan_id:
                    type: string
                    example: airs_7b3kQ9xV2mN8pL4rT6wY1z
                check_ids:
                    type: array
                    description: >-
                        The checks the prompt covers, in the order it presents them; empty when the scan has nothing to fix.
                    items:
                        type: string
                    example: [llms_txt, api_catalog]
                estimated_tokens:
                    type: integer
                    description: Rough size of the prompt in model tokens, at about four characters per token.
                    example: 812
                prompt:
                    type: string
                    description: Markdown text to paste into a coding agent; empty when `check_ids` is.
        AIReadinessCheckResult:
            type: object
            required:
                - id
                - title
                - description
                - scope
                - goal
                - guidance
                - category
                - tier
                - status
                - evidence
                - evidence_truncated
            properties:
                id:
                    type: string
                    description: >-
                        Stable check identifier. Historical and retired IDs are preserved, not dropped. Use the inline applicability guidance.
                title:
                    type: string
                    nullable: true
                    description: Title stored with the result, or null for legacy checks without a display snapshot.
                description:
                    type: string
                    nullable: true
                    description: Description stored with the result, or null for legacy checks without a display snapshot.
                category:
                    type: string
                    description: >-
                        The stored display group. Open. Known values: the categories accepted by `CreateAIReadinessScanRequest.categories`, and `unknown` for legacy checks without a display snapshot.
                tier:
                    type: string
                    description: >-
                        How much the check matters. Open. Known values: `do_now`: established practice for every site. `do_when_relevant`: matters only for some sites. `test_first`: promising but unproven; report it, do not score it. `watch`: early; informational only. `unknown`: metadata unavailable; retain the outcome but do not infer scoring from the current catalog.
                scope:
                    type: string
                    nullable: true
                    description: >-
                        What the check assessed, stored with the result: `site` (the site as a whole, from its home page and discovery locations). Earlier scans may also hold `submitted_page`, `origin`, `related_origins` or `bounded_sitemaps`; null for legacy checks without a display snapshot. Open: clients must handle values they do not recognise.
                status:
                    type: string
                    enum:
                        - pass
                        - warn
                        - fail
                        - not_applicable
                        - inconclusive
                        - not_checked
                    description: >-
                        The outcome. `inconclusive`: the check ran but could not decide. `not_checked`: this scan does not run the check.
                priority:
                    type: integer
                    minimum: 1
                    description: >-
                        Order in which to work on this check, 1 first. Present only on checks that need action (`fail` or `warn`); ranked by tier first, then by the expected benefit of a fix, then catalog order. Absent on other checks and on reports recorded before checks were ranked.
                    example: 1
                detail:
                    type: string
                    maxLength: 512
                    description: >-
                        A short explanation of the outcome, when one is available. It is plain text that can quote the scanned site, so render it as text, never as HTML or Markdown. Control and invisible characters are removed; quoted HTML or header examples are kept as text.
                evidence:
                    type: array
                    maxItems: 16
                    description: >-
                        Observations supporting this check's selected verdict. At most 16 entries per check, with a shared 65536-byte budget across serialized evidence arrays, including brackets and separators, in catalog order. Empty for unavailable or legacy evidence, not proof nothing was checked. This is not enough to re-score or reproduce a whole scan. Reserved: no check returns evidence yet, so the array is always empty.
                    items:
                        $ref: "#/components/schemas/AIReadinessEvidence"
                evidence_truncated:
                    type: boolean
                    description: Whether supporting observations were omitted because of limits or invalid data; privacy redaction alone does not set this flag.
                goal:
                    type: string
                    nullable: true
                    description: Stored goal for the selected guidance, or null for legacy scans.
                guidance:
                    allOf:
                        - $ref: "#/components/schemas/AIReadinessGuidance"
                    nullable: true
                    description: >-
                        Inline report-specific guidance selected when the scan completes. Null for legacy scans; never regenerated on reads. Stored guidance that fails validation is replaced by guidance with `reason_code: invalid_guidance_snapshot`, `truncated: true` and no solutions. `status` is the observed outcome and drives badges and the summary counts; `guidance.disposition` is the recommended action and drives calls to action. They are set separately, so any combination can occur: for example `status: fail` with `applicability: not_applicable` and `disposition: none` (a failed check that does not apply to this site), `status: fail` with `disposition: review` (an optional capability to consider, not a mandatory fix), or `status: inconclusive` with `disposition: review`. Show a call to action only when `disposition` is not `none`.
        CreateAIReadinessDraftsRequest:
            type: object
            properties:
                include:
                    type: array
                    description: >-
                        Opt-in drafts that change the site's crawl or AI-use policy, never drafted by default.
                    items:
                        type: string
                        enum: [robots_txt]
        AIReadinessDraftsResponse:
            type: object
            required:
                - generated_at
                - scan_id
                - files
                - truncated
            properties:
                scan_id:
                    type: string
                    example: airs_4fQx9pW2kLmN8sT1vYbZ3a
                generated_at:
                    type: string
                    format: date-time
                files:
                    type: array
                    description: One draft per file; empty when no failing check has a draft.
                    items:
                        $ref: "#/components/schemas/AIReadinessDraftFile"
                truncated:
                    type: boolean
                    description: Whether drafts were omitted because of size limits or content that failed validation.
        AIReadinessDraftFile:
            type: object
            required:
                - path
                - media_type
                - content
                - check_id
                - notes
                - changes_policy
            properties:
                path:
                    type: string
                    description: Where to publish the file on the site.
                    example: /.well-known/api-catalog
                check_id:
                    type: string
                    description: The catalog check this file addresses.
                    example: api_catalog
                media_type:
                    type: string
                    description: The Content-Type to serve the file with.
                    example: application/linkset+json
                changes_policy:
                    type: boolean
                    description: Whether publishing the file changes who may crawl or use the site's content.
                notes:
                    type: array
                    description: Things to confirm or complete before publishing.
                    items:
                        type: string
                content:
                    type: string
                    description: The draft file's full content.
        AIReadinessGuidance:
            type: object
            description: >-
                Persisted guidance, at most 8192 serialized JSON bytes per check. Selection is scoped to this report, not a universal fix list. Passed and confirmed not-applicable checks have no solutions. Unknown applicability requires review. Raw status counts are unchanged.
            required: [applicability, disposition, reason_code, reason, solutions, truncated]
            properties:
                applicability:
                    type: string
                    enum: [applicable, not_applicable, unknown]
                disposition:
                    type: string
                    enum: [fix, review, consider, none]
                    description: Fix an evidenced defect, review intent or evidence, consider optional adoption, or take no action.
                reason_code:
                    type: string
                    maxLength: 128
                    description: Stable selection reason; clients must allow new codes.
                reason:
                    type: string
                    maxLength: 512
                truncated:
                    type: boolean
                    description: Optional advice was malformed, invalid, or omitted because of publication limits.
                solutions:
                    type: array
                    maxItems: 2
                    items:
                        $ref: "#/components/schemas/AIReadinessSolution"
        AIReadinessSolution:
            type: object
            required: [id, title, source, instructions, resources]
            properties:
                id:
                    type: string
                    maxLength: 128
                    description: Stable identifier for the selected kind of advice; not a separately fetchable resource.
                title:
                    type: string
                    maxLength: 512
                source:
                    type: string
                    enum: [curated, provider]
                    description: Source of the instructions; resource provenance is recorded separately.
                instructions:
                    type: string
                    minLength: 1
                    maxLength: 4096
                    description: >-
                        The check-specific fix in plain words, at most 4096 UTF-8 bytes. Advice shared by every check is in the report's `guidance_notes`; for a paste-ready prompt, use the fix-prompt endpoint. Provider instructions are used for an applicable fix, and for a review unless the check sets crawl or AI-use policy. Suggestions require human review and are never executed automatically. Instructions can quote the scanned site, so render them as plain text, never as HTML or Markdown. Control and invisible characters are removed from provider instructions; quoted HTML or header examples are kept as text.
                resources:
                    type: array
                    maxItems: 6
                    items:
                        $ref: "#/components/schemas/AIReadinessResource"
        AIReadinessResource:
            type: object
            required: [kind, source, title, url]
            properties:
                title:
                    type: string
                    maxLength: 512
                url:
                    type: string
                    format: uri
                    maxLength: 2048
                    description: >-
                        Reviewed HTTPS reference without credentials or a query; not fetched or executed. One canonical form per document: an RFC is `https://www.rfc-editor.org/rfc/rfcN.html`, optionally with a section anchor (`#section-4.1`, `#name-...`), the only fragment allowed; an Internet-Draft is its unversioned Datatracker page.
                kind:
                    type: string
                    description: >-
                        Open. Known values: `rfc`, `ietf_draft`, `documentation`. An IETF draft is not an RFC or an adoption requirement.
                source:
                    type: string
                    enum: [curated, provider]
                    description: Whether this reviewed link was supplied by the provider or by maintained guidance.
        AIReadinessScanSummary:
            type: object
            description: The scan's checks counted by status. All zero until the scan completes.
            required:
                - pass
                - warn
                - fail
                - not_applicable
                - inconclusive
                - not_checked
            properties:
                pass:
                    type: integer
                warn:
                    type: integer
                fail:
                    type: integer
                not_applicable:
                    type: integer
                inconclusive:
                    type: integer
                not_checked:
                    type: integer
        RegisterSiteRequest:
            type: object
            required:
                - site_url
            properties:
                site_url:
                    type: string
                    format: uri
                    maxLength: 2048
                    description: >-
                        Fully-qualified URL of the WordPress site (scheme + host required). Longer than 2048 bytes is rejected with 400.
                    example: https://example.wpengine.com
                display_name:
                    type: string
                    maxLength: 255
                    description: >-
                        Human-readable name for the site, at most 255 characters (characters, not bytes — multi-byte names are measured the same way). Optional; defaults to site_url, truncated to fit.
                    example: My Blog
                project_id:
                    type: string
                    maxLength: 64
                    description: >-
                        WP Engine project to associate the site with. Optional — omit when the site is not scoped to a project.
                    example: proj_01abc
                site_info:
                    $ref: "#/components/schemas/SiteInfo"
        RegisterSiteResponse:
            type: object
            required:
                - site_id
                - client_id
                - status
                - created_at
                - site_hmac_secret
            properties:
                site_id:
                    type: string
                    pattern: "^site_[0-9A-Za-z]{22}$"
                    description: Stable gateway-owned identifier for the logical site.
                    example: site_01AbCdEfGhIjKlMnOpQrSt
                client_id:
                    type: string
                    description: >-
                        The current Dynamic Client Registration credential identifier for the site. It can change when the site reconnects.
                    example: client_01abc
                status:
                    type: string
                    enum:
                        - active
                        - revoked
                        - suspended
                    description: Current registration status of the site.
                    example: active
                created_at:
                    type: string
                    format: date-time
                    description: >-
                        When the site was first registered (UTC). Unchanged on subsequent updates to the same site.
                    example: "2024-01-15T10:30:00Z"
                site_hmac_secret:
                    type: string
                    pattern: "^[0-9a-f]{64}$"
                    description: >-
                        Per-site HMAC secret for deriving anonymous user identifiers. 32 random bytes hex-encoded (64 chars). Preserved across re-registrations. The plugin must store this securely and never send it back to the gateway.
                    example: "abcd1234abcd1234abcd1234abcd1234abcd1234abcd1234abcd1234abcd1234"
        DeregisterSiteResponse:
            type: object
            required:
                - status
            properties:
                status:
                    type: string
                    enum:
                        - deregistered
                    description: Confirms the registration was revoked.
                    example: deregistered
        Site:
            type: object
            properties:
                site_id:
                    type: string
                    pattern: "^site_[0-9A-Za-z]{22}$"
                    description: Stable gateway-owned identifier for the logical site.
                client_id:
                    type: string
                    description: Current oauth-ext registration identifier.
                account_id:
                    type: string
                project_id:
                    type: string
                    description: The WP Engine project this site belongs to, if assigned.
                site_url:
                    type: string
                status:
                    type: string
                    description: Registration lifecycle state.
                    enum: [active, revoked, suspended]
                kb_collection_id:
                    type: string
                    nullable: true
                    description: >-
                        The site's primary KB collection, or null when no primary is set. Always present in the response.
            required: [client_id, account_id, site_url, status, kb_collection_id]
        UpdateSitePrimaryCollection:
            type: object
            properties:
                kb_collection_id:
                    type: string
                    nullable: true
                    description: Collection id to set as primary, or null to clear it.
                expected_kb_collection_id:
                    type: string
                    nullable: true
                    description: >-
                        Optional current primary collection precondition. When present, the update succeeds only if the current binding equals this value; use null to require an unbound site.
            required: [kb_collection_id]
        SiteInfo:
            type: object
            description: >-
                WordPress environment metadata collected by the plugin at registration time. All fields are optional.
            properties:
                active_plugins:
                    type: array
                    maxItems: 500
                    items:
                        type: string
                        maxLength: 256
                    description: Names of currently active WordPress plugins.
                php_version:
                    type: string
                    maxLength: 64
                    example: "8.2.0"
                wp_version:
                    type: string
                    maxLength: 64
                    example: "6.5.0"
                active_theme:
                    type: string
                    maxLength: 256
                    example: twentytwentyfour
                locale:
                    type: string
                    maxLength: 64
                    example: en_US
                server_software:
                    type: string
                    maxLength: 256
                    example: Apache/2.4.57
                db_version:
                    type: string
                    maxLength: 64
                    example: "8.0.33"
                memory_limit:
                    type: string
                    maxLength: 32
                    example: 256M
                timezone:
                    type: string
                    maxLength: 64
                    example: America/Chicago
                active_plugin_count:
                    type: integer
                    minimum: 0
                    description: >-
                        Total number of active plugins on the site. May exceed len(active_plugins) when the plugin list was truncated at 500 items.
                    example: 12
                ssl_valid:
                    type: boolean
                    example: true
                is_multisite:
                    type: boolean
                    example: false
                wp_debug:
                    type: boolean
                    example: false
                wpe_plugins:
                    type: object
                    additionalProperties:
                        type: string
                    description: >-
                        Active WP Engine plugins mapped to their version. Optional: on the heartbeat an absent field keeps the stored map, and an empty object means none are active. An empty array is also accepted; any other array is rejected. The gateway keeps only slugs `power`, `power-*` and `wpe-*` (the Power plugin reports as `wpe-hub`), at most 20 in slug order, and drops slugs over 64 characters and entries whose version is empty, not a string or over 32 characters. `POST /v1/sites` accepts the field but does not store it; heartbeats record it.
                    example:
                        wpe-hub: "1.2.0"
        SiteHeartbeatRequest:
            type: object
            required: [site_info]
            properties:
                site_info:
                    $ref: "#/components/schemas/SiteInfo"
                plugin_status:
                    type: string
                    enum: [active, inactive]
                    description: >-
                        WP Engine AI plugin lifecycle status. Omit this property when the heartbeat is sent by a shared auth consumer that does not own Power lifecycle.
                abilities:
                    type: array
                    description: >-
                        Current ability descriptors. Omit this property to leave the cached catalog unchanged; send an empty array to clear it.
                    items:
                        $ref: "#/components/schemas/SiteAbilityDescriptor"
        SiteAbilityDescriptor:
            type: object
            required: [name]
            properties:
                name:
                    type: string
                label:
                    type: string
                description:
                    type: string
                category:
                    type: string
                input_schema:
                    type: object
                output_schema:
                    type: object
                meta:
                    type: object
                run_url:
                    type: string
                    format: uri
        SiteHeartbeatResponse:
            type: object
            required:
                - last_site_update_at
                - plugin_status_updated_at
                - abilities_sync_status
                - abilities_count
                - plugin_status
            properties:
                last_site_update_at:
                    type: string
                    format: date-time
                plugin_status_updated_at:
                    type: string
                    format: date-time
                abilities_synced_at:
                    type: string
                    format: date-time
                abilities_sync_status:
                    type: string
                    enum: [never_synced, ok, stale, error]
                abilities_count:
                    type: integer
                    minimum: 0
                plugin_status:
                    type: string
                    enum: [active, inactive]
        SiteAuthorizationRevokedError:
            type: object
            required: [error, message]
            properties:
                error:
                    type: string
                    enum: [site_authorization_revoked]
                message:
                    type: string
                    example: this site's authorization has been revoked
        SiteCommunicationError:
            type: object
            required: [error, message]
            properties:
                error:
                    type: string
                    enum: [site_communication_failed]
                message:
                    type: string
                    example: WP Engine AI could not reach the site's WordPress abilities API
        HealthResponse:
            type: object
            required:
                - status
            properties:
                status:
                    type: string
                    example: ok
        ModelsResponse:
            type: object
            required:
                - object
                - data
            properties:
                object:
                    type: string
                    example: list
                data:
                    type: array
                    items:
                        $ref: "#/components/schemas/ModelInfo"
        ModelSchemaResponse:
            type: object
            description: >-
                Per-model JSON Schemas. input_schema validates a chat completion request body for this model (with model-specific parameter constraints baked in); output_schema describes the chat completion response. Both are JSON Schema 2020-12 documents emitted as free-form objects.
            required:
                - id
                - input_schema
                - output_schema
            properties:
                id:
                    type: string
                    description: The namespaced model ID the schemas were generated for.
                    example: anthropic/claude-haiku-4-5
                input_schema:
                    type: object
                    description: JSON Schema (2020-12) for the chat completion request body.
                    additionalProperties: true
                output_schema:
                    type: object
                    description: JSON Schema (2020-12) for the chat completion response body.
                    additionalProperties: true
        ModelInfo:
            type: object
            required:
                - id
                - object
                - owned_by
                - provider
                - display_name
            properties:
                id:
                    type: string
                    example: google/gemini-3.5-flash
                object:
                    type: string
                    example: model
                owned_by:
                    type: string
                    description: >-
                        Provider organization name preserved for OpenAI /v1/models compatibility (e.g. "openai", "anthropic", "moonshotai").
                    example: openai
                provider:
                    type: string
                    description: >-
                        Canonical provider key used by the console for grouping and iconography. One of: "openai", "google", "gemma", "anthropic", "deepseek", "kimi", "glm", "minimax", "qwen".
                    example: openai
                display_name:
                    type: string
                    description: Human-readable model name for UI display.
                    example: GPT OSS 120B
                description:
                    type: string
                    description: Short marketing-style description of the model's capabilities.
                capabilities:
                    type: array
                    description: >-
                        Operations and features this model supports. Clients that build agents or tool-calling flows should only offer models whose capabilities include "tools".
                    items:
                        type: string
                        enum:
                            - chat
                            - image_generation
                            - speech_generation
                            - transcription
                            - alt_text
                            - summary
                            - taxonomy
                            - messages
                            - tools
                            - vision
                            - documents
                            - reasoning
                            - web_search
                    example: ["chat", "tools", "reasoning"]
                context_window:
                    type: integer
                    description: Maximum input context length in tokens.
                    example: 200000
                max_output_tokens:
                    type: integer
                    description: >-
                        Maximum number of output tokens the model can generate in a single response. Omitted when no limit is published for the model.
                    example: 128000
                parameters:
                    $ref: "#/components/schemas/Parameters"
                pricing:
                    $ref: "#/components/schemas/ModelPricing"
                deprecation_date:
                    type: string
                    format: date
                    description: >-
                        The date this model was announced as deprecated, in YYYY-MM-DD form. Absent for a model with no announced deprecation. On and after this date the model is still served unchanged, but new integrations should prefer an alternative — where one exists, the model description names it.
                    example: "2026-01-05"
                removal_date:
                    type: string
                    format: date
                    description: >-
                        The date this model stops being served, in YYYY-MM-DD form. Absent when the model is deprecated but no removal date has been announced yet. After this date requests naming the model are rejected, and it is no longer shown in the console model catalog.
                    example: "2026-07-05"
        Parameters:
            type: object
            description: >-
                Per-model parameter constraints. Omitted for models with no constrained parameters.
            properties:
                temperature:
                    $ref: "#/components/schemas/NumericParamSpec"
                response_format_type:
                    $ref: "#/components/schemas/StringEnumParamSpec"
        NumericParamSpec:
            type: object
            description: >-
                Rules for a numeric chat parameter. Omitted when not applicable. Supported parameters publish max (and optionally min); unsupported parameters publish supported: false.
            properties:
                supported:
                    type: boolean
                    description: >-
                        When false, the model rejects any explicit value for this parameter (provider default only). Omitted when max is published.
                    example: false
                min:
                    type: number
                    format: double
                    description: >-
                        Smallest accepted value, inclusive. Omitted when the minimum is 0; clients and the gateway treat a missing min as 0.
                max:
                    type: number
                    format: double
                    description: >-
                        Largest accepted value, inclusive. Published for every supported parameter (when supported is not false).
                    example: 1.0
        StringEnumParamSpec:
            type: object
            description: >-
                Rules for a string-enum chat parameter. Omitted when not applicable. Values lists every accepted string the model honours end-to-end through the current relay.
            properties:
                values:
                    type: array
                    items:
                        type: string
                    description: Every accepted value for this parameter.
                    example: ["text"]
        ModelPricing:
            type: object
            description: >-
                Per-unit pricing for a model, in credits. Token rates apply to chat-family models; the per-image, per-character, and per-megabyte rates apply to image generation, speech generation, and transcription respectively. Only the rates that apply to a given model are present, so a chat model carries token rates and an image model carries per_image. All rates are decimal strings to avoid floating-point drift.
            required:
                - pricing_version
                - unit
            properties:
                input_per_million:
                    type: string
                    description: Credits per 1,000,000 input tokens.
                    example: "1.5"
                output_per_million:
                    type: string
                    description: Credits per 1,000,000 output tokens.
                    example: "9"
                cache_read_per_million:
                    type: string
                    description: Credits per 1,000,000 tokens read from the prompt cache.
                    example: "0.5"
                cache_write_per_million:
                    type: string
                    description: Credits per 1,000,000 tokens written to the prompt cache.
                    example: "6.25"
                reasoning_per_million:
                    type: string
                    description: >-
                        Credits per 1,000,000 reasoning tokens, when a model bills those separately from output tokens.
                    example: "9"
                per_web_search:
                    type: string
                    description: >-
                        Credits per web search the provider runs during a chat call, charged on top of tokens. Present on models that support web search.
                    example: "0.01"
                per_image:
                    type: string
                    description: Credits per generated image.
                    example: "0.04"
                per_million_characters:
                    type: string
                    description: Credits per 1,000,000 characters of generated speech.
                    example: "30"
                per_megabyte_audio:
                    type: string
                    description: Credits per megabyte of transcribed audio.
                    example: "2.25"
                pricing_version:
                    type: string
                    description: >-
                        Identifies the rate card these prices were taken from. Compare it between responses to detect a repricing.
                    example: "2026-05-01"
                unit:
                    type: string
                    description: The unit every rate above is denominated in.
                    enum:
                        - credits
                    example: credits
        ChatCompletionRequest:
            type: object
            required:
                - model
                - messages
            example:
                model: google/gemini-3.5-flash
                messages:
                    - role: user
                      content: Say hello in one short sentence.
            properties:
                model:
                    type: string
                    description: >-
                        Model identifier in the format "provider/model-name" (e.g. "openai/gpt-oss-120b-maas", "google/gemini-3.5-flash", "anthropic/claude-sonnet-4-6").
                    example: google/gemini-3.5-flash
                messages:
                    type: array
                    minItems: 1
                    items:
                        $ref: "#/components/schemas/Message"
                temperature:
                    type: number
                    format: double
                    description: >-
                        Sampling temperature. See the model's `parameters.temperature` metadata on /models for the accepted range and support. Rejected with HTTP 400 when out of range, unsupported, or not applicable.
                top_p:
                    type: number
                    format: double
                    description: Nucleus sampling parameter.
                max_tokens:
                    type: integer
                    description: >-
                        Hard upper bound on output tokens for this request, forwarded to the model provider. Generation stops when the limit is reached; the response may be truncated mid-content rather than rejected. `finish_reason: "length"` (OpenAI-compatible routes) indicates the budget was hit. On reasoning-capable models (see capabilities on GET /v1/models), internal reasoning tokens may count against this budget alongside visible output. Per-model valid ranges are published in GET /v1/models/{model_id}/schema.
                stream:
                    type: boolean
                    default: false
                    description: >-
                        If true, the response is streamed as Server-Sent Events.
                stop:
                    type: array
                    items:
                        type: string
                    description: Stop sequences.
                tools:
                    type: array
                    items:
                        $ref: "#/components/schemas/ChatCompletionTool"
                    description: >-
                        Tools available to the model. Function tools invoke caller-defined functions; native `web_search` tools enable server-side search on models that advertise the `web_search` capability (see GET /v1/models).
                tool_choice:
                    description: >-
                        Controls how the model selects tools. Can be "auto", "none", "required", or an object specifying a particular function.
                response_format:
                    allOf:
                        - $ref: "#/components/schemas/ResponseFormat"
                    description: >-
                        Structured output format. See the model's `parameters.response_format_type` metadata on /models for the accepted values. Rejected with HTTP 400 when the type is unsupported or not applicable.
                reasoning_effort:
                    type: string
                    description: >-
                        Catalog-native reasoning effort. Allowed values are the model's `parameters.reasoning_effort` on GET /v1/models. Omit to use the provider default. Models that do not publish an enum reject any non-empty value. Mutually exclusive with `provider_options.thinking_config` on `google/*` models.
                    example: high
                provider_options:
                    type: object
                    additionalProperties: true
                    description: >-
                        Provider-specific parameters. Supported `openai/*` and `google/*` models.
                    example:
                        thinking_config:
                            thinking_budget: 1024
                            include_thoughts: true
        Message:
            type: object
            required:
                - role
                - content
            properties:
                role:
                    type: string
                    enum:
                        - system
                        - user
                        - assistant
                        - tool
                    example: user
                content:
                    type: string
                    example: Say hello in one short sentence.
                tool_calls:
                    type: array
                    items:
                        $ref: "#/components/schemas/ToolCall"
                    description: Tool calls made by the assistant.
                tool_call_id:
                    type: string
                    description: ID of the tool call this message is a response to (role must be "tool").
                annotations:
                    type: array
                    readOnly: true
                    items:
                        $ref: "#/components/schemas/UrlCitationAnnotation"
                    description: >-
                        Sources the answer drew on when web search ran. Returned on assistant messages only; don't send it back in requests.
        UrlCitationAnnotation:
            type: object
            required:
                - type
                - url_citation
            properties:
                type:
                    type: string
                    enum:
                        - url_citation
                url_citation:
                    type: object
                    required:
                        - url
                    properties:
                        url:
                            type: string
                            description: Link to the source. It may be a redirect link that expires.
                        title:
                            type: string
                        start_index:
                            type: integer
                            description: Start of the cited span in the message content.
                        end_index:
                            type: integer
                            description: End of the cited span in the message content.
        Tool:
            type: object
            required:
                - type
                - function
            properties:
                type:
                    type: string
                    enum:
                        - function
                    example: function
                function:
                    $ref: "#/components/schemas/ToolFunction"
        WebSearchTool:
            type: object
            description: >-
                Lets the model search the web while answering. Only models that list the `web_search` capability in `/v1/models` accept it; others return 400. The model decides whether to search. On Gemini models, sources are returned as `url_citation` entries in the assistant message's `annotations`. At most one web_search tool per request.
            required:
                - type
            properties:
                type:
                    type: string
                    enum:
                        - web_search
                    example: web_search
                allowed_domains:
                    type: array
                    items:
                        type: string
                    description: >-
                        Domains the model may search. Omit to allow all domains supported by the provider. Gemini models can't restrict search to a list of domains and return 400 when this is set; use `blocked_domains` instead.
                blocked_domains:
                    type: array
                    items:
                        type: string
                    description: Domains the model must not search.
        ChatCompletionTool:
            oneOf:
                - $ref: "#/components/schemas/Tool"
                - $ref: "#/components/schemas/WebSearchTool"
            discriminator:
                propertyName: type
                mapping:
                    function: "#/components/schemas/Tool"
                    web_search: "#/components/schemas/WebSearchTool"
            description: >-
                A single tools[] entry. `type: function` invokes a caller-defined function; `type: web_search` enables native server-side search on supported models.
        ToolCall:
            type: object
            required:
                - id
                - type
                - function
            properties:
                id:
                    type: string
                type:
                    type: string
                    example: function
                function:
                    $ref: "#/components/schemas/ToolFunction"
        ToolFunction:
            type: object
            required:
                - name
            properties:
                name:
                    type: string
                description:
                    type: string
                arguments:
                    type: string
                    description: JSON-encoded arguments for the function call.
                parameters:
                    description: JSON Schema describing the function parameters.
        ResponseFormat:
            type: object
            required:
                - type
            properties:
                type:
                    type: string
                    description: >-
                        The response format type. Use "text" for plain text (default), "json_object" for unstructured JSON mode, or "json_schema" for structured output that conforms to a provided JSON Schema.
                    enum:
                        - text
                        - json_object
                        - json_schema
                    example: json_schema
                json_schema:
                    $ref: "#/components/schemas/JSONSchemaParam"
        JSONSchemaParam:
            type: object
            description: >-
                Describes the JSON Schema the model must follow when response_format.type is "json_schema".
            required:
                - name
                - schema
            properties:
                name:
                    type: string
                    description: A name identifying this schema (for caching and logging).
                    example: recipe
                description:
                    type: string
                    description: Optional human-readable description of the schema purpose.
                schema:
                    type: object
                    description: >-
                        A JSON Schema object describing the desired output structure. Supports standard JSON Schema types (object, array, string, number, integer, boolean) with provider-specific subset limitations.
                    additionalProperties: true
                strict:
                    type: boolean
                    description: >-
                        Whether to request strict schema adherence. When true, the gateway forwards this preference to providers that support strict/JSON-schema-constrained decoding (for example, OpenAI and Anthropic). Not all providers honor this flag, and the gateway does not independently validate or guarantee schema compliance.
        McpJsonRpcMessage:
            oneOf:
                - $ref: "#/components/schemas/McpInitializeRequest"
                - $ref: "#/components/schemas/McpPingRequest"
                - $ref: "#/components/schemas/McpListToolsRequest"
                - $ref: "#/components/schemas/McpCallToolRequest"
                - $ref: "#/components/schemas/McpInitializedNotification"
            discriminator:
                propertyName: method
                mapping:
                    initialize: "#/components/schemas/McpInitializeRequest"
                    ping: "#/components/schemas/McpPingRequest"
                    "tools/list": "#/components/schemas/McpListToolsRequest"
                    "tools/call": "#/components/schemas/McpCallToolRequest"
                    "notifications/initialized": "#/components/schemas/McpInitializedNotification"
            description: >-
                A single JSON-RPC 2.0 request or notification per the MCP spec. Only the fixed protocol envelope for this server's method surface is typed here — it registers tools only (no resources, prompts, sampling, or roots), so those method families are omitted. Per-tool data (`tools/call`'s `arguments`, a tool's `inputSchema`/`outputSchema`) stays opaque and is deliberately not duplicated here: fetch it live via `tools/list` or an MCP Inspector session, since that is always current and this can drift.
        McpInitializeRequest:
            type: object
            description: JSON-RPC request initiating the MCP session handshake.
            required:
                - jsonrpc
                - id
                - method
                - params
            properties:
                jsonrpc:
                    type: string
                    enum:
                        - "2.0"
                id:
                    oneOf:
                        - type: string
                        - type: integer
                method:
                    type: string
                    enum:
                        - initialize
                params:
                    type: object
                    required:
                        - protocolVersion
                        - capabilities
                        - clientInfo
                    properties:
                        protocolVersion:
                            type: string
                            description: MCP protocol version the client supports, e.g. "2025-06-18".
                        capabilities:
                            type: object
                            additionalProperties: true
                            description: >-
                                Client-declared capabilities (roots, sampling, elicitation, etc.) per the MCP spec.
                        clientInfo:
                            $ref: "#/components/schemas/McpImplementation"
        McpPingRequest:
            type: object
            description: JSON-RPC liveness check at the protocol level.
            required:
                - jsonrpc
                - id
                - method
            properties:
                jsonrpc:
                    type: string
                    enum:
                        - "2.0"
                id:
                    oneOf:
                        - type: string
                        - type: integer
                method:
                    type: string
                    enum:
                        - ping
        McpListToolsRequest:
            type: object
            description: JSON-RPC request listing the tools this server exposes.
            required:
                - jsonrpc
                - id
                - method
            properties:
                jsonrpc:
                    type: string
                    enum:
                        - "2.0"
                id:
                    oneOf:
                        - type: string
                        - type: integer
                method:
                    type: string
                    enum:
                        - "tools/list"
                params:
                    type: object
                    properties:
                        cursor:
                            type: string
                            description: >-
                                Opaque pagination cursor from a previous response's `nextCursor`.
        McpCallToolRequest:
            type: object
            description: JSON-RPC request invoking one tool.
            required:
                - jsonrpc
                - id
                - method
                - params
            properties:
                jsonrpc:
                    type: string
                    enum:
                        - "2.0"
                id:
                    oneOf:
                        - type: string
                        - type: integer
                method:
                    type: string
                    enum:
                        - "tools/call"
                params:
                    type: object
                    required:
                        - name
                    properties:
                        name:
                            type: string
                            description: Tool name, e.g. `list_account_sites`.
                        arguments:
                            type: object
                            additionalProperties: true
                            description: >-
                                Tool-specific input matching that tool's `inputSchema`. Fetch the authoritative shape live via `tools/list` rather than relying on static docs.
        McpInitializedNotification:
            type: object
            description: >-
                Notification confirming the client has processed the `initialize` response. Notifications carry no `id` and receive no reply (HTTP 202).
            required:
                - jsonrpc
                - method
            properties:
                jsonrpc:
                    type: string
                    enum:
                        - "2.0"
                method:
                    type: string
                    enum:
                        - "notifications/initialized"
        McpImplementation:
            type: object
            description: >-
                Identity of an MCP client or server implementation. This server reports name wpengine, its build version, a display title, a one-line description, the WP Engine logomark as icons, and the MCP docs URL as websiteUrl.
            required:
                - name
                - version
            properties:
                name:
                    type: string
                    description: Programmatic identifier of the implementation.
                title:
                    type: string
                    description: Optional human-readable name for display in a client UI.
                description:
                    type: string
                    description: Optional human-readable description of the implementation.
                icons:
                    type: array
                    description: >-
                        Optional icons for display in a client UI. This server sends the same mark as an SVG and as a PNG, both as base64 data URIs.
                    items:
                        type: object
                        required:
                            - src
                        properties:
                            src:
                                type: string
                                description: An https URL or a base64 data URI for the image.
                            mimeType:
                                type: string
                            sizes:
                                type: array
                                items:
                                    type: string
                                description: >-
                                    Sizes the image suits, such as 128x128, or any for a scalable format.
                            theme:
                                type: string
                                enum:
                                    - light
                                    - dark
                                description: The background the icon is designed for, when it is designed for one.
                version:
                    type: string
                    description: >-
                        Implementation version. This server reports an opaque identifier of the build serving the request, which changes with each deploy. Do not parse it or compare it for ordering.
                websiteUrl:
                    type: string
                    format: uri
                    description: Optional URL of the implementation's website or documentation.
        McpJsonRpcPostBody:
            oneOf:
                - $ref: "#/components/schemas/McpJsonRpcMessage"
                - type: array
                  description: >-
                    JSON-RPC 2.0 batch of up to 10 messages. POST bodies with more than 10 messages are rejected with HTTP 400 and a JSON-RPC Invalid Request error before any message is dispatched.
                  minItems: 1
                  maxItems: 10
                  items:
                    $ref: "#/components/schemas/McpJsonRpcMessage"
        McpJsonRpcSuccessResponse:
            type: object
            description: >-
                JSON-RPC 2.0 success response. `result`'s shape depends on the request's `method` — see `McpInitializeResult`, `McpPingResult`, `McpListToolsResult`, and `McpCallToolResult`.
            required:
                - jsonrpc
                - id
                - result
            properties:
                jsonrpc:
                    type: string
                    enum:
                        - "2.0"
                id:
                    oneOf:
                        - type: string
                        - type: integer
                result:
                    oneOf:
                        - $ref: "#/components/schemas/McpInitializeResult"
                        - $ref: "#/components/schemas/McpPingResult"
                        - $ref: "#/components/schemas/McpListToolsResult"
                        - $ref: "#/components/schemas/McpCallToolResult"
        McpInitializeResult:
            type: object
            description: Result of an `initialize` request.
            required:
                - protocolVersion
                - capabilities
                - serverInfo
            properties:
                protocolVersion:
                    type: string
                capabilities:
                    type: object
                    additionalProperties: true
                    description: >-
                        Server-declared capabilities. This server advertises tools, and resources when its tool set includes resource documents — never prompts, sampling, roots, or list change notifications.
                serverInfo:
                    $ref: "#/components/schemas/McpImplementation"
                instructions:
                    type: string
                    description: Optional human-readable usage instructions from the server.
        McpPingResult:
            type: object
            description: Empty result confirming the server is responsive.
            additionalProperties: false
        McpListToolsResult:
            type: object
            description: Result of a `tools/list` request.
            required:
                - tools
            properties:
                tools:
                    type: array
                    items:
                        type: object
                        required:
                            - name
                            - inputSchema
                        properties:
                            name:
                                type: string
                            title:
                                type: string
                                description: Human-readable name for display in a client UI.
                            description:
                                type: string
                            inputSchema:
                                type: object
                                additionalProperties: true
                                description: >-
                                    The tool's input JSON Schema. Fetch live rather than relying on a static copy.
                            annotations:
                                type: object
                                additionalProperties: true
                                description: >-
                                    Hints about the tool's behavior. Every tool sets both readOnlyHint and destructiveHint: a read-only tool sends destructiveHint false, and a tool that changes data sends destructiveHint true.
                                properties:
                                    readOnlyHint:
                                        type: boolean
                                        description: True when the tool does not modify anything.
                                    destructiveHint:
                                        type: boolean
                                        description: True when the tool may change or delete data.
                            outputSchema:
                                type: object
                                additionalProperties: true
                                description: The tool's output JSON Schema, when it declares one.
                nextCursor:
                    type: string
                    description: >-
                        Opaque pagination cursor for the next page, when more tools remain.
        McpCallToolResult:
            type: object
            description: Result of a `tools/call` request.
            required:
                - content
            properties:
                content:
                    type: array
                    description: >-
                        Content blocks returned by the tool (text, images, etc.) per the MCP spec. Shape is per-tool and intentionally not typed further here.
                    items:
                        type: object
                        additionalProperties: true
                structuredContent:
                    type: object
                    additionalProperties: true
                    description: >-
                        Optional structured result matching the tool's `outputSchema`, when the tool declares one. Oversized site ability and knowledge-base search/fetch results instead contain `result_truncated: true` and an `excerpt` string.
                isError:
                    type: boolean
                    description: >-
                        True when the tool call failed; `content` then holds a human-readable error description rather than the tool's normal result.
        McpJsonRpcError:
            type: object
            description: JSON-RPC 2.0 error object.
            required:
                - code
                - message
            properties:
                code:
                    type: integer
                    description: >-
                        JSON-RPC error code (e.g. -32600 Invalid Request, -32601 Method not found, -32602 Invalid params, -32603 Internal error).
                message:
                    type: string
                data:
                    type: object
                    additionalProperties: true
                    description: Optional additional error context.
        McpJsonRpcErrorResponse:
            type: object
            description: JSON-RPC 2.0 error response.
            required:
                - jsonrpc
                - error
            properties:
                jsonrpc:
                    type: string
                    enum:
                        - "2.0"
                id:
                    nullable: true
                error:
                    $ref: "#/components/schemas/McpJsonRpcError"
        McpJsonRpcResponseBody:
            oneOf:
                - $ref: "#/components/schemas/McpJsonRpcSuccessResponse"
                - $ref: "#/components/schemas/McpJsonRpcErrorResponse"
                - type: array
                  description: JSON-RPC 2.0 responses for a batch request.
                  items:
                    oneOf:
                        - $ref: "#/components/schemas/McpJsonRpcSuccessResponse"
                        - $ref: "#/components/schemas/McpJsonRpcErrorResponse"
        McpJsonRpcBatchTooLargeError:
            type: object
            description: >-
                JSON-RPC 2.0 error returned when a POST body is a batch exceeding 10 messages.
            required:
                - jsonrpc
                - error
            properties:
                jsonrpc:
                    type: string
                    enum:
                        - "2.0"
                id:
                    nullable: true
                error:
                    allOf:
                        - $ref: "#/components/schemas/McpJsonRpcError"
                    example:
                        code: -32600
                        message: batch exceeds maximum of 10 calls
        McpProtectedResourceMetadata:
            type: object
            description: >-
                OAuth 2.0 Protected Resource Metadata (RFC 9728 §2) for the MCP endpoint. Fields not listed here are omitted; a client must ignore members it does not understand.
            required:
                - resource
                - authorization_servers
                - bearer_methods_supported
            properties:
                resource:
                    type: string
                    description: >-
                        The canonical URI of the MCP endpoint. A client must discard this document if the value is not identical to the URL it requested the MCP endpoint at (RFC 9728 §3.3).
                    example: https://api.wpengineapi.com/v1/mcp
                authorization_servers:
                    type: array
                    description: >-
                        Issuer identifiers of the authorization servers that issue access tokens for this resource. A client discovers each one's endpoints from its own metadata document (RFC 8414).
                    items:
                        type: string
                bearer_methods_supported:
                    type: array
                    description: >-
                        How an access token may be presented. Only the Authorization request header is supported.
                    items:
                        type: string
                        enum:
                            - header
                scopes_supported:
                    type: array
                    description: >-
                        Scopes an access token may grant at the MCP endpoint. Each tool accepts one or more of them.
                    items:
                        type: string
                    example:
                        - urn:wpengine:ai:wordpress:rw
                        - urn:wpengine:hosting:tools:rw
                resource_name:
                    type: string
                    description: >-
                        Human-readable name of the resource, for a client to show while the user signs in.
                    example: WP Engine
                resource_documentation:
                    type: string
                    format: uri
                    description: URL of developer documentation for the MCP endpoint.
                    example: https://developers.wpengine.com/docs/ai/api/mcp/
        ChatCompletionResponse:
            type: object
            required:
                - id
                - object
                - created
                - model
                - choices
            properties:
                id:
                    type: string
                    example: chatcmpl-abc123
                object:
                    type: string
                    example: chat.completion
                created:
                    type: integer
                    format: int64
                    description: Unix timestamp.
                model:
                    type: string
                choices:
                    type: array
                    items:
                        $ref: "#/components/schemas/Choice"
                usage:
                    $ref: "#/components/schemas/Usage"
        ChatCompletionChunk:
            type: object
            required:
                - id
                - object
                - created
                - model
                - choices
            properties:
                id:
                    type: string
                object:
                    type: string
                    example: chat.completion.chunk
                created:
                    type: integer
                    format: int64
                model:
                    type: string
                choices:
                    type: array
                    items:
                        $ref: "#/components/schemas/StreamChoice"
                usage:
                    $ref: "#/components/schemas/Usage"
        Choice:
            type: object
            required:
                - index
            properties:
                index:
                    type: integer
                message:
                    $ref: "#/components/schemas/Message"
                finish_reason:
                    type: string
                    enum:
                        - stop
                        - length
                        - tool_calls
                        - content_filter
                        - model_context_window_exceeded
        StreamChoice:
            type: object
            required:
                - index
            properties:
                index:
                    type: integer
                delta:
                    $ref: "#/components/schemas/Delta"
                finish_reason:
                    type: string
                    enum:
                        - stop
                        - length
                        - tool_calls
                        - content_filter
                        - model_context_window_exceeded
        Delta:
            type: object
            properties:
                role:
                    type: string
                    enum:
                        - assistant
                content:
                    type: string
                tool_calls:
                    type: array
                    items:
                        $ref: "#/components/schemas/ToolCall"
                annotations:
                    type: array
                    items:
                        $ref: "#/components/schemas/UrlCitationAnnotation"
                    description: >-
                        Sources the answer drew on when web search ran, sent on the final chunk.
        CompletionTokensDetails:
            type: object
            properties:
                reasoning_tokens:
                    type: integer
                    description: >-
                        Tokens the model spent reasoning before answering, already counted in completion_tokens. Omitted when zero.
        PromptTokensDetails:
            type: object
            properties:
                cached_tokens:
                    type: integer
                    description: >-
                        Prompt tokens served from cache, already counted in prompt_tokens. Omitted when zero.
                cache_write_tokens:
                    type: integer
                    description: >-
                        Prompt tokens written to cache, already counted in prompt_tokens. Omitted when zero.
        Usage:
            type: object
            required:
                - prompt_tokens
                - completion_tokens
                - total_tokens
            properties:
                prompt_tokens:
                    type: integer
                    description: Total prompt tokens, including any cached or cache-write tokens.
                completion_tokens:
                    type: integer
                    description: Total completion tokens, including any reasoning tokens.
                total_tokens:
                    type: integer
                prompt_tokens_details:
                    $ref: "#/components/schemas/PromptTokensDetails"
                completion_tokens_details:
                    $ref: "#/components/schemas/CompletionTokensDetails"
        ImageGenerationRequest:
            type: object
            required:
                - model
                - prompt
            properties:
                model:
                    type: string
                    description: >-
                        Model identifier in "provider/model-name" format (e.g. "google/gemini-2.5-flash-image").
                    example: google/gemini-2.5-flash-image
                prompt:
                    type: string
                    description: Text prompt describing the desired image.
                n:
                    type: integer
                    minimum: 1
                    maximum: 4
                    default: 1
                    description: Number of images to generate (1-4).
                size:
                    type: string
                    description: >-
                        Image dimensions (e.g. "1024x1024", "1024x1792", "1792x1024").
                    example: "1024x1024"
        ImageGenerationResponse:
            type: object
            required:
                - created
                - data
            properties:
                created:
                    type: integer
                    format: int64
                    description: Unix timestamp.
                data:
                    type: array
                    items:
                        $ref: "#/components/schemas/ImageData"
        ImageData:
            type: object
            required:
                - b64_json
            properties:
                b64_json:
                    type: string
                    description: Base64-encoded image data.
                revised_prompt:
                    type: string
                    description: >-
                        The prompt as revised by the model (may differ from the input).
        ErrorResponse:
            type: object
            required:
                - error
            properties:
                error:
                    type: object
                    required:
                        - message
                        - type
                        - code
                        - request_id
                    properties:
                        message:
                            type: string
                        type:
                            type: string
                            example: invalid_request_error
                        error_code:
                            type: string
                            description: >-
                                Stable, machine-readable cause, set by routes that document their codes (the AI readiness routes); absent elsewhere and on errors from shared layers such as authentication. Clients must allow new codes.
                        code:
                            type: integer
                        request_id:
                            type: string
                            description: >-
                                Correlation ID for this request, matching the X-Request-ID response header — a 32-character trace ID behind the load balancer, otherwise a UUID. Quote it in support reports.
                            example: 80f1e2c3a4b5c6d7e8f9a0b1c2d3e4f5
        AltTextRequest:
            type: object
            required:
                - image
            properties:
                model:
                    type: string
                    description: >-
                        Optional model identifier. Defaults to a Gemini vision model when omitted.
                    example: google/gemini-3.5-flash
                image:
                    type: string
                    description: Base64-encoded image data. The decoded image must not exceed 20 MiB.
                mime_type:
                    type: string
                    description: >-
                        MIME type of the image (e.g. "image/png", "image/jpeg"). Defaults to "image/png".
                    default: image/png
                context:
                    type: string
                    description: >-
                        Optional context describing how the metadata should be produced. For example, "this is a product photo for an e-commerce site, focus on the product details".
        AltTextResponse:
            type: object
            required:
                - alt_text
            properties:
                alt_text:
                    type: string
                    description: The generated alt-text for the image.
                title:
                    type: string
                    description: A short, descriptive title for the image.
                caption:
                    type: string
                    description: A brief caption suitable for display below the image.
                description:
                    type: string
                    description: A detailed description of the image.
                model:
                    type: string
                    description: The model used for generation.
        SummaryRequest:
            type: object
            required:
                - content
            properties:
                model:
                    type: string
                    description: >-
                        Optional model identifier. Defaults to a Gemini model when omitted.
                    example: google/gemini-3.5-flash
                content:
                    type: string
                    description: The content to summarize.
                    maxLength: 100000
                context:
                    type: string
                    description: >-
                        Optional context describing the content domain (e.g. "newsroom article", "product listing", "press release").
        SummaryResponse:
            type: object
            required:
                - headline
                - summary
                - seo_description
                - social_description
                - key_points
                - model
            properties:
                headline:
                    type: string
                    description: >-
                        An alternative headline for the content (8-15 words). Suitable for A/B testing or social media sharing.
                summary:
                    type: string
                    description: >-
                        A concise editorial summary (2-3 sentences). Suitable for newsletter digests, RSS feeds, and WordPress excerpt fields.
                seo_description:
                    type: string
                    description: >-
                        A search-engine-optimized meta description (130-155 characters). Written to maximize click-through from search results.
                social_description:
                    type: string
                    description: >-
                        A social media sharing description (1-2 sentences). More conversational, suitable for Open Graph and Twitter Card tags.
                key_points:
                    type: array
                    items:
                        type: string
                    description: >-
                        3-5 bullet points summarizing the main takeaways. Each point is one concise sentence.
                model:
                    type: string
                    description: The model used for generation.
        TaxonomyRequest:
            type: object
            required:
                - content
                - categories
            properties:
                model:
                    type: string
                    description: >-
                        Optional model identifier. Defaults to a Gemini model when omitted.
                    example: google/gemini-3.5-flash
                content:
                    type: string
                    description: The content to analyze for categorization and tagging.
                    maxLength: 100000
                categories:
                    type: array
                    minItems: 1
                    maxItems: 100
                    items:
                        type: string
                    description: Fixed list of categories to select from.
                approved_tags:
                    type: array
                    maxItems: 500
                    items:
                        type: string
                    description: >-
                        Optional list of pre-approved tags. Tags matching this list are flagged as "existing" in the response.
                new_tag_confidence_threshold:
                    type: number
                    format: double
                    minimum: 0.0
                    maximum: 1.0
                    default: 0.5
                    description: >-
                        Minimum confidence for including net-new tags. Tags with source "new" below this threshold are excluded from the response.
                context:
                    type: string
                    description: >-
                        Optional context describing the content domain (e.g. "newsroom article", "product listing").
        TaxonomyResponse:
            type: object
            required:
                - categories
                - tags
                - model
            properties:
                categories:
                    type: array
                    items:
                        $ref: "#/components/schemas/SuggestedCategory"
                tags:
                    type: array
                    items:
                        $ref: "#/components/schemas/SuggestedTag"
                model:
                    type: string
                    description: The model used for generation.
        SuggestedCategory:
            type: object
            required:
                - name
                - confidence
            properties:
                name:
                    type: string
                    description: Category name from the provided list.
                confidence:
                    type: number
                    format: double
                    description: Confidence score between 0.0 and 1.0.
        SuggestedTag:
            type: object
            required:
                - name
                - confidence
                - source
            properties:
                name:
                    type: string
                    description: The suggested tag.
                confidence:
                    type: number
                    format: double
                    description: Confidence score between 0.0 and 1.0.
                source:
                    type: string
                    enum:
                        - existing
                        - new
                    description: >-
                        Whether the tag matched the approved list ("existing") or was generated by the model ("new").
        SpeechRequest:
            type: object
            required:
                - input
            properties:
                model:
                    type: string
                    description: >-
                        Optional model identifier. Defaults to a Gemini TTS model when omitted.
                    example: google/gemini-2.5-flash-tts
                input:
                    type: string
                    description: The text to convert to speech.
                    maxLength: 5000
                response_format:
                    type: string
                    enum: [pcm, wav]
                    description: >-
                        Audio encoding format. "pcm" returns raw 16-bit linear PCM as received from the upstream provider. "wav" wraps the PCM data in a WAV container for direct browser playback. Omit for raw PCM (backward compatible).
                    example: wav
                voice:
                    type: string
                    description: >-
                        The Chirp 3 HD voice to use for speech synthesis. Defaults to "Kore". All 30 prebuilt voices are supported across 50+ languages.
                    default: Kore
                    enum:
                        - Achernar
                        - Achird
                        - Algenib
                        - Algieba
                        - Alnilam
                        - Aoede
                        - Autonoe
                        - Callirrhoe
                        - Charon
                        - Despina
                        - Enceladus
                        - Erinome
                        - Fenrir
                        - Gacrux
                        - Iapetus
                        - Kore
                        - Laomedeia
                        - Leda
                        - Orus
                        - Pulcherrima
                        - Puck
                        - Rasalgethi
                        - Sadachbia
                        - Sadaltager
                        - Schedar
                        - Sulafat
                        - Umbriel
                        - Vindemiatrix
                        - Zephyr
                        - Zubenelgenubi
        TranscriptionRequest:
            type: object
            required:
                - audio
            properties:
                model:
                    type: string
                    description: >-
                        Optional model identifier. Defaults to a Gemini model when omitted.
                    example: google/gemini-3.5-flash
                audio:
                    type: string
                    description: Base64-encoded audio data.
                mime_type:
                    type: string
                    description: >-
                        MIME type of the audio (e.g. "audio/wav", "audio/mp3", "audio/ogg"). Defaults to "audio/wav".
                    default: audio/wav
                language:
                    type: string
                    description: >-
                        Optional ISO 639-1 language code hint for transcription (e.g. "en", "es", "fr").
        TranscriptionResponse:
            type: object
            required:
                - text
                - model
            properties:
                text:
                    type: string
                    description: The transcribed text.
                model:
                    type: string
                    description: The model used for transcription.
        AnalyticsResponse:
            type: object
            required:
                - bucket_width
                - start
                - end
                - totals
                - buckets
            properties:
                bucket_width:
                    type: string
                    enum: [10m, 1h, 1d]
                    description: The bucket width used for the response, echoing the request parameter.
                start:
                    type: string
                    format: date-time
                    description: Inclusive start of the response window (UTC).
                end:
                    type: string
                    format: date-time
                    description: Exclusive end of the response window (UTC).
                totals:
                    $ref: "#/components/schemas/AnalyticsTotals"
                buckets:
                    type: array
                    items:
                        $ref: "#/components/schemas/AnalyticsBucket"
        FeedbackAnalyticsResponse:
            type: object
            required:
                - daily
                - monthly
            properties:
                daily:
                    type: array
                    items:
                        $ref: "#/components/schemas/FeedbackBucket"
                    description: Session counts per feedback state, sparse (days with no sessions are omitted), over the last 30 days.
                monthly:
                    type: array
                    items:
                        $ref: "#/components/schemas/FeedbackBucket"
                    description: Session counts per feedback state, sparse (months with no sessions are omitted), over the last 12 months.
        FeedbackBucket:
            type: object
            required:
                - date
                - no_votes
                - thumbs_up_only
                - thumbs_down_only
                - mixed_votes
            properties:
                date:
                    type: string
                    format: date-time
                    description: Start of the bucket (day or month) in UTC.
                no_votes:
                    type: integer
                    description: Sessions with no feedback votes.
                thumbs_up_only:
                    type: integer
                    description: Sessions with only thumbs-up votes.
                thumbs_down_only:
                    type: integer
                    description: Sessions with only thumbs-down votes.
                mixed_votes:
                    type: integer
                    description: Sessions with both thumbs-up and thumbs-down votes.
        CreditsResponse:
            type: object
            required:
                - credits_nano
            properties:
                credits_nano:
                    type: integer
                    format: int64
                    description: >-
                        Remaining credit balance, in exact integer nanocredits (1 credit = 1,000,000,000 nanocredits). Divide by 1,000,000,000 to get credits.
                    example: 42500000000
        FeaturesResponse:
            type: object
            required:
                - features
                - toggles
            properties:
                features:
                    type: array
                    description: >-
                        Feature keys the authenticated caller may currently use (e.g. "console-coworker") — granted, and not turned off via a self-service toggle. Only currently-usable features are listed; an empty array means none.
                    items:
                        type: string
                    example:
                        - console-coworker
                toggles:
                    type: array
                    description: >-
                        The subset of granted features the caller may toggle themselves, with their current preference. Most features have no entry here — only ones marked self-service eligible.
                    items:
                        $ref: "#/components/schemas/FeatureToggleInfo"
        FeatureToggleInfo:
            type: object
            required:
                - feature
                - display_name
                - description
                - enabled
            properties:
                feature:
                    type: string
                    description: The feature key.
                    example: personal-api-keys
                display_name:
                    type: string
                    description: A short, human-readable label for the feature.
                    example: User API Keys
                description:
                    type: string
                    description: A short, human-readable summary of the feature.
                enabled:
                    type: boolean
                    description: The caller's current preference for this feature.
        CreateCollectionRequest:
            type: object
            required:
                - name
            properties:
                name:
                    type: string
                    maxLength: 255
                    description: >-
                        Human-readable collection name. Must be non-empty (after trimming surrounding whitespace), at most 255 characters, and free of control characters. Must be unique within the project.
                    example: Product documentation
                description:
                    type: string
                    maxLength: 8192
                    deprecated: true
                    description: Deprecated. Not used by the LLM search tool.
                    example: Product documentation, API reference guides, and release changelogs.
                set_primary:
                    type: boolean
                    description: >-
                        When true and the caller is site-authenticated, the new collection is also set as the site's primary KB collection in the same request.
                metadata:
                    type: object
                    description: >-
                        Optional structured metadata bag populated by the producer plugin during collection sync. The gateway consumes selected keys when composing the description of this collection's search tool. Must be a JSON object no larger than 64 KB; any other JSON type (array, string, number, boolean, null) is rejected with 400. Omit to store as SQL NULL.
        UpdateCollectionRequest:
            type: object
            properties:
                name:
                    type: string
                    maxLength: 255
                    description: >-
                        New collection name. Cannot be null. Must be unique within the project.
                    example: Product docs
                description:
                    type: string
                    maxLength: 8192
                    nullable: true
                    deprecated: true
                    description: Deprecated. Not used by the LLM search tool.
                    example: Product documentation, API reference guides, and release changelogs.
                metadata:
                    type: object
                    nullable: true
                    description: >-
                        New structured metadata bag populated by the producer plugin during collection sync. The gateway consumes selected keys when composing the description of this collection's search tool. When present, must be a JSON object no larger than 64 KB; any other JSON type is rejected with 400. Set to null to clear.
        CollectionResponse:
            type: object
            required:
                - id
                - project_id
                - name
                - description
                - created_at
                - updated_at
            properties:
                id:
                    type: string
                    description: Unique identifier for the collection.
                project_id:
                    type: string
                    description: The project the collection belongs to.
                name:
                    type: string
                    description: Human-readable collection name.
                    example: Product documentation
                description:
                    type: string
                    deprecated: true
                    description: Deprecated. Not used by the LLM search tool.
                    example: Product documentation, API reference guides, and release changelogs.
                created_at:
                    type: string
                    format: date-time
                    description: When the collection was created (UTC).
                updated_at:
                    type: string
                    format: date-time
                    description: When the collection was last updated (UTC).
                metadata:
                    type: object
                    description: >-
                        Structured metadata bag populated by the producer plugin during collection sync. Omitted from the response when the collection has no metadata set.
        CollectionDetailResponse:
            type: object
            allOf:
                - $ref: "#/components/schemas/CollectionResponse"
                - type: object
                  required:
                    - doc_count
                    - index_size_bytes
                  properties:
                    doc_count:
                        type: integer
                        format: int64
                        description: Number of documents currently indexed in this collection.
                        example: 128
                    index_size_bytes:
                        type: integer
                        format: int64
                        description: Storage size of the collection's indexed content, in bytes.
                        example: 524288
        ListCollectionsResponse:
            type: object
            required:
                - collections
            properties:
                collections:
                    type: array
                    items:
                        $ref: "#/components/schemas/CollectionResponse"
        IndexDocumentRequest:
            type: object
            required:
                - content
            properties:
                id:
                    type: string
                    description: >-
                        Stable document id. Supply it to make index idempotent (re-indexing the same id replaces the document); generated when omitted.
                content:
                    type: string
                    description: The document text indexed for search.
                title:
                    type: string
                type:
                    type: string
                    description: Document type (e.g. the WordPress post type).
                uri:
                    type: string
                    description: Canonical URL for the document.
                language:
                    type: string
                    description: ISO 639-1 language code.
                created_at:
                    type: string
                    format: date-time
                modified_at:
                    type: string
                    format: date-time
                metadata:
                    type: object
                    additionalProperties: true
                    description: >-
                        Free-form metadata; values are stored as keywords for exact-match filtering.
                    example: {"status": "publish", "category": "news", "tags": ["guide", "billing"]}
        IndexDocumentResponse:
            type: object
            required:
                - id
                - result
            properties:
                id:
                    type: string
                    description: The document id (supplied or generated).
                result:
                    type: string
                    enum: [created, updated, unchanged]
        DocumentResponse:
            description: The stored document — the indexed fields plus its id and content_hash.
            allOf:
                - $ref: "#/components/schemas/IndexDocumentRequest"
                - type: object
                  required:
                    - id
                    - content_hash
                  properties:
                    id:
                        type: string
                        description: The document id.
                    content_hash:
                        type: string
                        description: SHA-256 of the content, set by the gateway.
        BulkIndexRequest:
            type: object
            required:
                - documents
            properties:
                documents:
                    type: array
                    minItems: 1
                    maxItems: 100
                    items:
                        $ref: "#/components/schemas/IndexDocumentRequest"
        BulkItemResult:
            type: object
            required:
                - id
                - status
            properties:
                id:
                    type: string
                result:
                    type: string
                    enum: [created, updated, unchanged]
                status:
                    type: integer
                    description: HTTP-style status for this item (e.g. 201, 200, 400).
                error:
                    type: string
                    description: Failure reason, present only when the item failed.
        BulkIndexResponse:
            type: object
            required:
                - items
            properties:
                items:
                    type: array
                    items:
                        $ref: "#/components/schemas/BulkItemResult"
        SearchRequest:
            type: object
            description: >-
                A search over a collection. Supply `query` for ranked hybrid retrieval (results include snippets). Omit `query` to browse, filter, sort, or aggregate the collection; query-less results carry no snippets. Aggregations may be requested in either mode.
            properties:
                query:
                    type: string
                    description: >-
                        Optional natural-language query. When present, results are ranked by relevance and include snippets.
                filters:
                    $ref: "#/components/schemas/SearchFilters"
                sort:
                    type: array
                    items:
                        $ref: "#/components/schemas/SortField"
                    description: >-
                        Order results by typed fields. Supplying sort returns field-ordered results instead of relevance-ranked ones.
                aggregations:
                    type: array
                    items:
                        $ref: "#/components/schemas/Aggregation"
                    description: Facet counts and metrics computed over the filtered result set.
                top_n:
                    type: integer
                    minimum: 1
                    maximum: 50
                    description: Maximum results to return (defaults to 10; must be between 1 and 50).
        SearchFilters:
            type: object
            description: Filters applied alongside the query.
            properties:
                type:
                    type: array
                    items:
                        type: string
                    description: Post types to include.
                uri:
                    type: array
                    items:
                        type: string
                    description: Document URIs to include.
                language:
                    type: array
                    items:
                        type: string
                    description: ISO 639-1 language codes to include.
                metadata:
                    type: object
                    additionalProperties:
                        type: array
                        items:
                            type: string
                    description: >-
                        Exact-match filters keyed by metadata field; each field maps to a list of accepted values.
                    example: {"status": ["publish"], "category": ["news", "guides"]}
                created_at:
                    $ref: "#/components/schemas/DateRange"
                modified_at:
                    $ref: "#/components/schemas/DateRange"
        DateRange:
            type: object
            description: Inclusive date bounds (RFC-3339). Either bound may be omitted.
            properties:
                gte:
                    type: string
                    format: date-time
                lte:
                    type: string
                    format: date-time
        SortField:
            type: object
            required:
                - field
            properties:
                field:
                    type: string
                    enum: [created_at, modified_at, title.keyword, type, uri, language]
                order:
                    type: string
                    enum: [asc, desc]
                    description: Defaults to asc.
        Aggregation:
            type: object
            required:
                - name
                - field
                - type
            properties:
                name:
                    type: string
                    description: Key the result is returned under.
                field:
                    type: string
                    description: >-
                        Field to aggregate. terms accepts keyword fields (type, uri, language, title.keyword) or metadata.<key>; min/max/date_histogram accept created_at or modified_at.
                type:
                    type: string
                    enum: [terms, min, max, date_histogram]
                interval:
                    type: string
                    enum: [day, week, month, quarter, year]
                    description: Required for date_histogram; invalid for other types.
                size:
                    type: integer
                    minimum: 1
                    maximum: 1000
                    description: >-
                        Maximum number of terms buckets to return (default 10). Valid only for terms; invalid for other types.
        SearchResponse:
            type: object
            required:
                - citations
            properties:
                citations:
                    type: array
                    items:
                        $ref: "#/components/schemas/Citation"
                aggregations:
                    type: object
                    additionalProperties:
                        $ref: "#/components/schemas/AggregationResult"
                    description: Present only when aggregations were requested; keyed by aggregation name.
        AggregationResult:
            type: object
            description: buckets for terms/date_histogram; value for min/max on date fields.
            properties:
                buckets:
                    type: array
                    items:
                        $ref: "#/components/schemas/AggregationBucket"
                value:
                    type: string
                    description: RFC-3339 timestamp for min/max on date fields.
                other_doc_count:
                    type: integer
                    format: int64
                    description: >-
                        terms only. Documents in buckets beyond the returned size. A non-zero value means the facet was truncated; request a larger size to retrieve more buckets.
        AggregationBucket:
            type: object
            properties:
                key:
                    type: string
                doc_count:
                    type: integer
                    format: int64
        Citation:
            description: A ranked result with its source attribution and matching snippet(s).
            type: object
            required:
                - id
                - score
            properties:
                id:
                    type: string
                    description: The document id.
                title:
                    type: string
                uri:
                    type: string
                type:
                    type: string
                    description: The document's post type.
                snippets:
                    type: array
                    items:
                        type: string
                    description: The matching content fragment(s).
                score:
                    type: number
                    format: double
                    description: The relevance score used to rank this result; higher is more relevant.
        CreateAgentRequest:
            type: object
            required:
                - name
                - project_id
            properties:
                name:
                    type: string
                    maxLength: 255
                    description: Human-readable agent name.
                    example: Site Concierge
                model:
                    type: string
                    maxLength: 255
                    description: >-
                        Identifier of the model that powers the agent (e.g. `anthropic/claude-sonnet-4-6`). Required unless `profile` is set.
                    example: anthropic/claude-sonnet-4-6
                profile:
                    type: string
                    maxLength: 64
                    description: >-
                        Profile that owns some of the agent's fields, listed in the response's `managed_fields`. Owned fields cannot be written; `model` may be set to one of the profile's `allowed_models`, and when omitted the profile's default model is used. Reserved for WP Engine first-party clients: API-key callers cannot set it. Current product profiles include `chatbot-v1`, `standalone-coworker-v1`, and `power-coworker-v1`.
                guardrails:
                    $ref: "#/components/schemas/AgentGuardrails"
                description:
                    type: string
                    maxLength: 4096
                    description: Free-form description of what the agent does.
                system_prompt:
                    type: string
                    maxLength: 32768
                    description: >-
                        User prompt template (site prompt) prepended to every conversation powered by this agent.
                project_id:
                    type: string
                    description: >-
                        The project the agent belongs to. Required — the caller must always supply it explicitly. For a service-token caller authenticating a site, the project must be owned by the same account that owns the site. For an API key, it must match the key's own project exactly.
                temperature:
                    type: number
                    format: float
                    minimum: 0
                    maximum: 2
                    description: Sampling temperature applied to chat completions.
                max_tokens:
                    type: integer
                    minimum: 1
                    maximum: 200000
                    description: >-
                        Hard upper bound on output tokens per agent turn, forwarded to the model provider as max_tokens on each turn. Generation stops when the limit is reached; the response may be truncated mid-content rather than rejected. On reasoning-capable models (see capabilities on GET /v1/models), internal reasoning tokens may count against this budget alongside visible output. Omitted values leave the limit unset so provider-specific defaults apply (Anthropic defaults to 8192 when unset; OpenAI-compatible routes omit the field). Compare with the model's max_output_tokens on GET /v1/models, which is the catalog ceiling for a single response. Values above the catalog-wide maximum are rejected with 400. When a turn exhausts this budget, any partial agent.message is followed by session.error with error_code max_tokens rather than being treated as a complete reply.
                reasoning_effort:
                    type: string
                    description: >-
                        Catalog-native reasoning effort for this agent's model. Allowed values are the model's `parameters.reasoning_effort` on GET /v1/models. Omit to use the provider default. Models that do not publish an enum reject any non-empty value.
                scopes:
                    type: array
                    description: >-
                        Permission scopes the agent operates under. Must be drawn from the site's existing scopes (e.g. `chat`, `search`).
                    items:
                        type: string
                settings:
                    type: object
                    additionalProperties: true
                    maxProperties: 32
                    description: >-
                        Feature toggles for the agent (e.g. `disable_kb_rag: true` to skip knowledge-base retrieval). Capped at 32 keys and 4 KiB serialized.
                mcp_servers:
                    type: array
                    maxItems: 20
                    description: MCP server definitions the agent may connect to.
                    items:
                        type: object
                        additionalProperties: true
                tools:
                    type: array
                    maxItems: 128
                    description: >-
                        Tool declarations available to the agent. See `AgentTool` for the per-entry contract.
                    items:
                        $ref: "#/components/schemas/AgentTool"
                skills:
                    type: array
                    maxItems: 64
                    description: Skills enabled for the agent.
                    items:
                        type: object
                        additionalProperties: true
                metadata:
                    type: object
                    additionalProperties:
                        type: string
                        maxLength: 512
                    maxProperties: 16
                    description: >-
                        Arbitrary string key-value metadata stored alongside the agent. The keys "scopes" and "settings" are reserved.
        UpdateAgentRequest:
            type: object
            description: >-
                Partial update request for an agent. All fields are optional; omit a field to preserve its current value.
            properties:
                name:
                    type: string
                    minLength: 1
                    maxLength: 255
                    description: >-
                        Human-readable agent name. Cannot be cleared (must be non-empty if provided).
                    example: Site Concierge
                model:
                    type: string
                    minLength: 1
                    maxLength: 255
                    nullable: true
                    description: >-
                        Identifier of the model that powers the agent (e.g. `anthropic/claude-sonnet-4-6`). Can only be cleared on an agent with a `profile`, where null means "use the profile's default".
                    example: anthropic/claude-sonnet-4-6
                profile:
                    type: string
                    maxLength: 64
                    description: >-
                        See `CreateAgentRequest.profile`. Adopting a profile without `model` in the same request keeps the stored model if the profile allows it, and otherwise uses the profile's default. Once set, a profile can be replaced by another but not removed.
                guardrails:
                    allOf:
                        - $ref: "#/components/schemas/AgentGuardrails"
                    description: >-
                        Partial update. Omit this property to preserve guardrails; an empty object also preserves the current moderation setting. Set `moderation` to `disabled` or `enabled` to replace it. Explicit null — at the `guardrails` level or its nested `moderation` key — is invalid, and profiled agents reject a `moderation` write because their profile owns it.
                description:
                    type: string
                    nullable: true
                    maxLength: 4096
                    description: >-
                        Free-form description of what the agent does. Send empty string or null to clear.
                system_prompt:
                    type: string
                    nullable: true
                    maxLength: 32768
                    description: >-
                        User prompt template (site prompt) prepended to every conversation powered by this agent. Send empty string or null to clear.
                project_id:
                    type: string
                    description: >-
                        Reassigns the agent to a different project. Cannot be cleared (an agent always belongs to exactly one project); the caller must be authorized for the new project (same rules as `CreateAgentRequest.project_id`).
                temperature:
                    type: number
                    format: float
                    nullable: true
                    minimum: 0
                    maximum: 2
                    description: Sampling temperature applied to chat completions. Send null to clear.
                max_tokens:
                    type: integer
                    nullable: true
                    minimum: 1
                    maximum: 200000
                    description: >-
                        Hard upper bound on output tokens per agent turn (see CreateAgentRequest.max_tokens for semantics). Send null to clear and fall back to provider-specific defaults on subsequent turns.
                reasoning_effort:
                    type: string
                    nullable: true
                    description: >-
                        Catalog-native reasoning effort for this agent's model. Allowed values are the model's `parameters.reasoning_effort` on GET /v1/models. Send null to clear (provider default). Omit the field to preserve the stored value. Changing `model` clears a stored value the new model does not accept.
                scopes:
                    type: array
                    nullable: true
                    description: >-
                        Permission scopes the agent operates under. Must be drawn from the site's existing scopes (e.g. `chat`, `search`). Send null or empty array to clear.
                    items:
                        type: string
                settings:
                    type: object
                    nullable: true
                    additionalProperties: true
                    maxProperties: 32
                    description: >-
                        Feature toggles for the agent (e.g. `disable_kb_rag: true` to skip knowledge-base retrieval). Capped at 32 keys and 4 KiB serialized. Send null or empty object to clear.
                mcp_servers:
                    type: array
                    nullable: true
                    maxItems: 20
                    description: >-
                        MCP server definitions the agent may connect to. Full replacement; send empty array or null to clear.
                    items:
                        type: object
                        additionalProperties: true
                tools:
                    type: array
                    nullable: true
                    maxItems: 128
                    description: >-
                        Tool declarations available to the agent. Full replacement; send an empty array or null to clear all of them. See `AgentTool` for the per-entry contract.
                    items:
                        $ref: "#/components/schemas/AgentTool"
                skills:
                    type: array
                    nullable: true
                    maxItems: 64
                    description: >-
                        Skills enabled for the agent. Full replacement; send empty array or null to clear.
                    items:
                        type: object
                        additionalProperties: true
                metadata:
                    type: object
                    additionalProperties:
                        type: string
                        nullable: true
                        maxLength: 512
                    maxProperties: 16
                    description: >-
                        Arbitrary string key-value metadata. Per-key patch: set a key to a string to add/update it, or to null to delete that key; omitted keys are preserved. Maximum 16 keys, keys up to 64 characters, values up to 512 characters. The keys "scopes" and "settings" are reserved.
        AgentGuardrails:
            type: object
            properties:
                moderation:
                    type: string
                    enum: ["disabled", "enabled"]
                    default: "disabled"
                    description: >-
                        Best-effort custom-agent moderation setting. Product profiles own this value: writes are rejected and the field is omitted from responses for profiled agents.
        AgentResponse:
            type: object
            required:
                - id
                - type
                - project_id
                - name
                - model
                - created_at
            properties:
                id:
                    type: string
                    description: Unique identifier for the agent.
                type:
                    type: string
                    enum: [agent]
                project_id:
                    type: string
                    description: The project the agent belongs to.
                name:
                    type: string
                model:
                    type: string
                description:
                    type: string
                    description: >-
                        Free-form description of what the agent does. On an agent with a `profile` this is the profile's current description.
                system_prompt:
                    type: string
                    description: >-
                        User prompt template (site prompt). On an agent with a `profile` this is the profile's current prompt.
                profile:
                    type: string
                    description: >-
                        Server-owned profile the agent follows (see `CreateAgentRequest.profile`). Omitted when the client owns every field.
                guardrails:
                    $ref: "#/components/schemas/AgentGuardrails"
                managed_fields:
                    type: array
                    items:
                        type: string
                    description: >-
                        Fields owned by the agent's profile, which the client cannot write. Omitted when the agent has no profile.
                    example: [model, system_prompt, description]
                allowed_models:
                    type: array
                    items:
                        type: string
                    description: >-
                        Models the agent's profile allows as a `model` choice. Omitted when the agent has no profile.
                temperature:
                    type: number
                    format: float
                max_tokens:
                    type: integer
                    description: >-
                        Output-token limit per turn (see CreateAgentRequest.max_tokens). Omitted when unset on the agent.
                reasoning_effort:
                    type: string
                    description: >-
                        Catalog-native reasoning effort stored on the agent. Omitted when unset. Allowed values follow the agent's current model on GET /v1/models.
                scopes:
                    type: array
                    description: Permission scopes the agent operates under (round-trips the request value).
                    items:
                        type: string
                settings:
                    type: object
                    additionalProperties: true
                    description: Feature toggles for the agent (round-trips the request value).
                mcp_servers:
                    type: array
                    items:
                        type: object
                        additionalProperties: true
                tools:
                    type: array
                    description: >-
                        Tool declarations (client tools, knowledge_base grounding entries, and echo/random_number evaluation tool opt-ins) round-tripped from the request.
                    items:
                        $ref: "#/components/schemas/AgentToolResponse"
                skills:
                    type: array
                    items:
                        type: object
                        additionalProperties: true
                metadata:
                    type: object
                    additionalProperties:
                        type: string
                        maxLength: 512
                    description: >-
                        User-supplied string metadata. Reserved keys ("scopes", "settings") are surfaced on their own top-level fields rather than appearing here.
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
                    nullable: true
        ListAgentsResponse:
            type: object
            required:
                - data
            properties:
                data:
                    type: array
                    items:
                        $ref: "#/components/schemas/AgentResponse"
                next_page:
                    type: string
                    description: >-
                        Opaque cursor for the next page. Omit (or empty) when no more results. Pass back verbatim as the `next_page` query parameter on the next request.
        ClientTool:
            type: object
            required:
                - name
            properties:
                type:
                    type: string
                    enum: [custom]
                    description: >-
                        Discriminator for the tools[] union. Omit for a plain client tool (the default); `custom` is the only value this schema accepts.
                name:
                    type: string
                    pattern: "^[a-zA-Z0-9_-]{1,64}$"
                    maxLength: 64
                    description: >-
                        Unique tool name. Must be unique within the agent's `tools` array (across every entry, regardless of type).
                description:
                    type: string
                    description: Human-readable description of what the tool does.
                input_schema:
                    type: object
                    description: JSON Schema defining the tool's input parameters.
                label:
                    type: string
                    maxLength: 64
                    description: >-
                        Optional short human-readable name for the tool, used alongside `name` and `description` when the gateway matches a search query against deferred tools. Supply it when the tool's `name` is a slug whose wording a natural-language query would not contain.
                defer_loading:
                    type: boolean
                    default: false
                    description: >-
                        When true, the tool is declared but kept out of the model's tool list until it is needed, so a large catalogue costs no context up front. The gateway offers the agent a search over the deferred tools and loads the matches, and a deferred tool the model names directly is loaded on demand. Once loaded, its input is enforced strictly against its schema — unlike a non-deferred tool, which keeps today's lenient handling — so a malformed call is rejected with a model-readable error instead of failing downstream. Leave false (the default) for tools that must be callable from the first turn.
        KnowledgeBaseTool:
            type: object
            description: >-
                A data-source declaration — one entry per collection. The gateway fans it into every runtime tool it currently supports over the collection (search, fetch, ...) and names them by convention from `collection_id`.
            required:
                - type
                - collection_id
            properties:
                type:
                    type: string
                    enum: [knowledge_base]
                collection_id:
                    type: string
                    description: The knowledge-base collection to ground retrieval against.
                filters:
                    nullable: true
                    allOf:
                        - $ref: "#/components/schemas/SearchFilters"
                    description: >-
                        Optional filter ceiling scoped to this collection. Null or omitted means unconstrained. Applies to every runtime tool the gateway emits from this entry — search results are constrained to matching docs, and a fetched doc that fails any dimension comes back as `not_found`.
        EchoTool:
            type: object
            required:
                - type
                - name
            properties:
                type:
                    type: string
                    enum: [echo]
                    description: >-
                        Opts the agent into the gateway's built-in echo tool (returns its input message unchanged). A local development aid for validating tool-call round-trips; it is only served in dev environments, where an agent declaring it elsewhere fails at session start with a `toolset_incomplete` error instead. Do not declare it on an agent you intend to run outside dev.
                name:
                    type: string
                    pattern: "^[a-zA-Z0-9_-]{1,64}$"
                    maxLength: 64
                    description: >-
                        Unique wire identifier for the tool, chosen by the caller. Must be unique within the agent's `tools` array.
        RandomNumberTool:
            type: object
            required:
                - type
                - name
            properties:
                type:
                    type: string
                    enum: [random_number]
                    description: >-
                        Opts the agent into the gateway's built-in random-number tool (returns an integer within a caller-given range). A local development aid for validating tool-call round-trips; it is only served in dev environments, where an agent declaring it elsewhere fails at session start with a `toolset_incomplete` error instead. Do not declare it on an agent you intend to run outside dev.
                name:
                    type: string
                    pattern: "^[a-zA-Z0-9_-]{1,64}$"
                    maxLength: 64
                    description: >-
                        Unique wire identifier for the tool, chosen by the caller. Must be unique within the agent's `tools` array.
        AgentTool:
            oneOf:
                - $ref: "#/components/schemas/ClientTool"
                - $ref: "#/components/schemas/KnowledgeBaseTool"
                - $ref: "#/components/schemas/EchoTool"
                - $ref: "#/components/schemas/RandomNumberTool"
            discriminator:
                propertyName: type
                mapping:
                    custom: "#/components/schemas/ClientTool"
                    knowledge_base: "#/components/schemas/KnowledgeBaseTool"
                    echo: "#/components/schemas/EchoTool"
                    random_number: "#/components/schemas/RandomNumberTool"
            description: >-
                A single tools[] entry. `type` selects the entry's behavior: absent (or `custom`) is a client tool executed by the caller; `knowledge_base` grounds the agent in a collection (the gateway emits and names its runtime tools); `echo` and `random_number` are local-development evaluation tools that deployed environments do not serve. `name` is required and unique across `tools` for every entry except `knowledge_base`. Names beginning `search_knowledge_base_` or `fetch_knowledge_base_` are reserved for the gateway-generated KB tools and are rejected.

                Every entry the gateway itself resolves — each `knowledge_base` entry and each built-in — must resolve at session start. If any does not, the session fails with a `toolset_incomplete` error rather than running with the subset that did resolve.
        ClientToolResponse:
            type: object
            properties:
                type:
                    type: string
                    enum: [custom]
                    description: >-
                        Discriminator for the tools[] union. Omit for a plain client tool (the default); `custom` is the only value this schema accepts.
                name:
                    type: string
                    pattern: "^[a-zA-Z0-9_-]{1,64}$"
                    maxLength: 64
                    description: >-
                        Unique tool name. Must be unique within the agent's `tools` array (across every entry, regardless of type). Always present for tools created since name validation was added; may be absent on an agent whose tools were stored before that validation existed.
                description:
                    type: string
                    description: Human-readable description of what the tool does.
                input_schema:
                    type: object
                    description: JSON Schema defining the tool's input parameters.
                label:
                    type: string
                    maxLength: 64
                    description: >-
                        Optional short human-readable name for the tool, used alongside `name` and `description` when the gateway matches a search query against deferred tools. Supply it when the tool's `name` is a slug whose wording a natural-language query would not contain.
                defer_loading:
                    type: boolean
                    default: false
                    description: >-
                        When true, the tool is declared but kept out of the model's tool list until it is needed, so a large catalogue costs no context up front. The gateway offers the agent a search over the deferred tools and loads the matches, and a deferred tool the model names directly is loaded on demand. Once loaded, its input is enforced strictly against its schema — unlike a non-deferred tool, which keeps today's lenient handling — so a malformed call is rejected with a model-readable error instead of failing downstream. Leave false (the default) for tools that must be callable from the first turn.
        AgentToolResponse:
            oneOf:
                - $ref: "#/components/schemas/ClientToolResponse"
                - $ref: "#/components/schemas/KnowledgeBaseTool"
                - $ref: "#/components/schemas/EchoTool"
                - $ref: "#/components/schemas/RandomNumberTool"
            discriminator:
                propertyName: type
                mapping:
                    custom: "#/components/schemas/ClientToolResponse"
                    knowledge_base: "#/components/schemas/KnowledgeBaseTool"
                    echo: "#/components/schemas/EchoTool"
                    random_number: "#/components/schemas/RandomNumberTool"
            description: >-
                A single tools[] entry as returned in a response. Identical to AgentTool except a plain client tool entry (type absent or `custom`) is not required to have `name` — an agent may hold tools stored before name validation existed.
        AnalyticsTotals:
            type: object
            required:
                - credits_nano
                - request_count
                - models
            properties:
                credits_nano:
                    type: integer
                    format: int64
                    description: >-
                        Total credits consumed, in exact integer nanocredits (1 credit = 1,000,000,000 nanocredits). Divide by 1,000,000,000 to get credits.
                    example: 12000000000
                request_count:
                    type: integer
                    description: Total number of requests.
                models:
                    type: array
                    description: >-
                        Per-model, per-operation breakdown sorted by credits descending. Entries with equal credits are ordered by model, operation, client_id, auth_method, actor_type then application (all ascending), so the order is stable across identical requests.
                    items:
                        $ref: "#/components/schemas/ModelAnalytics"
        AnalyticsBucket:
            type: object
            required:
                - timestamp
                - credits_nano
                - request_count
                - models
            properties:
                timestamp:
                    type: string
                    format: date-time
                    description: Start of this bucket (UTC).
                credits_nano:
                    type: integer
                    format: int64
                    description: >-
                        Credits consumed in this bucket, in exact integer nanocredits (1 credit = 1,000,000,000 nanocredits). Divide by 1,000,000,000 to get credits.
                    example: 1500000000
                request_count:
                    type: integer
                    description: Number of requests in this bucket.
                models:
                    type: array
                    items:
                        $ref: "#/components/schemas/ModelAnalytics"
        ModelAnalytics:
            type: object
            required:
                - model
                - operation
                - credits_nano
                - request_count
            properties:
                model:
                    type: string
                    description: Model identifier (e.g. "google/gemini-3.5-flash").
                    example: google/gemini-3.5-flash
                operation:
                    type: string
                    description: Operation type (e.g. "chat", "image").
                    example: chat
                client_id:
                    type: string
                    description: >-
                        The registered site this row is attributed to. Only present when client_id is included in the group_by parameter, and empty within such a response for usage that has no registered site (console, playground and direct API-key traffic).
                    example: wpe_site_9f2c41
                site_id:
                    type: string
                    description: >-
                        The stable site this row is attributed to, as returned by the sites API. It does not change when the site's client credentials rotate, so usage from all of the site's client_ids is combined. Only present when site_id is included in the group_by parameter, and empty within such a response for usage that cannot be resolved to a site.
                    example: site_3kTMd1aK9vQ2bXw7ZpL0sN
                auth_method:
                    type: string
                    description: >-
                        Authentication method for this row. Only present when auth_method is included in the group_by parameter.
                    enum: [browser_session, api_key, service_token, okta, internal_service, unknown]
                actor_type:
                    type: string
                    description: >-
                        Actor type for this row. Only present when actor_type is included in the group_by parameter.
                    enum: [anonymous, authenticated, service, unknown]
                application:
                    type: string
                    description: >-
                        Calling application for this row. Only present when application is included in the group_by parameter.
                    enum: [wpe-ai-chatbot, wpe-ai-playground, power-coworker, console-coworker, power-connector, wpe-agents, wpe-kb-sync, third_party, unknown]
                credits_nano:
                    type: integer
                    format: int64
                    description: >-
                        Credits consumed, in exact integer nanocredits (1 credit = 1,000,000,000 nanocredits). Divide by 1,000,000,000 to get credits.
                    example: 4230000000
                request_count:
                    type: integer
                    description: Number of requests for this model and operation.
        AnthropicMessagesRequest:
            type: object
            description: >-
                Standard Anthropic Messages API request. The full request shape is supported and forwarded to the model, including fields not listed here (tool_choice, stop_sequences, temperature, top_p, metadata, ...). See Anthropic's Messages API reference for the complete schema.
            required:
                - model
                - messages
                - max_tokens
            properties:
                model:
                    type: string
                    description: >-
                        Anthropic model name, prefixed or bare (e.g. "anthropic/claude-sonnet-4-6" or "claude-sonnet-4-6").
                    example: anthropic/claude-sonnet-4-6
                messages:
                    type: array
                    description: Conversation turns in Anthropic message format.
                    items:
                        $ref: "#/components/schemas/AnthropicMessage"
                max_tokens:
                    type: integer
                    minimum: 1
                    description: Maximum number of tokens to generate.
                    example: 1024
                system:
                    description: System prompt, as a string or array of content blocks.
                tools:
                    type: array
                    description: >-
                        Tool definitions in Anthropic tool format, each with a name, description, and input_schema.
                    items:
                        type: object
                stream:
                    type: boolean
                    description: >-
                        When true, the response is a Server-Sent Events stream using Anthropic's streaming event protocol.
                    default: false
                thinking:
                    type: object
                    description: Extended thinking configuration.
                    properties:
                        type:
                            type: string
                            enum: [enabled, disabled]
                        budget_tokens:
                            type: integer
                            description: Token budget for thinking when enabled.
        AnthropicMessage:
            type: object
            required:
                - role
                - content
            properties:
                role:
                    type: string
                    enum: [user, assistant]
                content:
                    description: >-
                        Message content: a plain string, or an array of content blocks (text, image, tool_use, tool_result, thinking, ...).
        AnthropicMessagesResponse:
            type: object
            description: Standard Anthropic Messages API response.
            properties:
                id:
                    type: string
                    example: msg_01XFDUDYJgAACzvnptvVoYEL
                type:
                    type: string
                    enum: [message]
                role:
                    type: string
                    enum: [assistant]
                model:
                    type: string
                    example: claude-sonnet-4-6
                content:
                    type: array
                    description: >-
                        Generated content blocks (text, tool_use, thinking, ...).
                    items:
                        type: object
                        properties:
                            type:
                                type: string
                                example: text
                stop_reason:
                    type: string
                    enum: [end_turn, max_tokens, stop_sequence, tool_use, model_context_window_exceeded]
                stop_sequence:
                    type: string
                    nullable: true
                    description: The matched custom stop sequence, when applicable.
                usage:
                    $ref: "#/components/schemas/AnthropicUsage"
        AnthropicUsage:
            type: object
            properties:
                input_tokens:
                    type: integer
                output_tokens:
                    type: integer
                cache_creation_input_tokens:
                    type: integer
                cache_read_input_tokens:
                    type: integer
                output_tokens_details:
                    type: object
                    description: >-
                        Breakdown of output_tokens. On streams it appears only on the final message_delta.
                    properties:
                        thinking_tokens:
                            type: integer
                            description: Thinking tokens, already counted in output_tokens.
                server_tool_use:
                    type: object
                    description: >-
                        Server-side tool calls the provider ran, each charged in credits on top of tokens. On streams the count is cumulative on message_delta.
                    properties:
                        web_search_requests:
                            type: integer
                            description: Web searches run for this message.
        AnthropicCountTokensRequest:
            type: object
            description: >-
                Same shape as an Anthropic Messages request without max_tokens; system and tools are included in the count when supplied.
            required:
                - model
                - messages
            properties:
                model:
                    type: string
                    example: anthropic/claude-sonnet-4-6
                messages:
                    type: array
                    items:
                        $ref: "#/components/schemas/AnthropicMessage"
                system:
                    description: System prompt, as a string or array of content blocks.
        AnthropicCountTokensResponse:
            type: object
            required:
                - input_tokens
            properties:
                input_tokens:
                    type: integer
                    description: Tokens the supplied request would consume as input.
                    example: 14
        AnthropicErrorResponse:
            type: object
            description: Anthropic error envelope, as parsed by Anthropic SDKs.
            required:
                - type
                - error
            properties:
                type:
                    type: string
                    enum: [error]
                error:
                    type: object
                    required:
                        - type
                        - message
                    properties:
                        type:
                            type: string
                            description: >-
                                Anthropic error type, e.g. "invalid_request_error", "authentication_error", "permission_error", "not_found_error", "request_too_large", "rate_limit_error", "overloaded_error", "api_error", or "content_policy_violation" (request content blocked by moderation policy when content moderation is enabled — never identifies which filter or category matched).
                            example: invalid_request_error
                        message:
                            type: string
                            example: max_tokens is required and must be greater than zero
                        request_id:
                            type: string
                            description: >-
                                Correlation ID for this request, matching the X-Request-ID response header. Quote it in support reports.
                            example: 80f1e2c3a4b5c6d7e8f9a0b1c2d3e4f5
        CreateSessionRequest:
            type: object
            required:
                - agent
            properties:
                agent:
                    oneOf:
                        - type: string
                        - type: object
                          required:
                            - id
                          properties:
                            id:
                                type: string
                            type:
                                type: string
                                enum: [agent]
                            version:
                                oneOf:
                                    - type: string
                                    - type: integer
                    description: >-
                        Agent reference (string id or {id, type, version}). Version is accepted but ignored.
                    example: agent_xyz
                title:
                    type: string
                    maxLength: 512
                    description: Session title.
                reasoning_effort:
                    type: string
                    description: >-
                        Optional session override for reasoning effort. Allowed values are the bound agent's current model `parameters.reasoning_effort` on GET /v1/models. Omit to inherit the agent's value (then the provider default).
                metadata:
                    type: object
                    additionalProperties:
                        type: string
                    maxProperties: 16
                    description: >-
                        String key-value metadata. Keys beginning with "wpe.account_access." are reserved and validated.
                owner_id:
                    type: string
                    maxLength: 255
                    description: >-
                        Opaque per-visitor id of the caller creating this session, for browser-session-backed consumers (e.g. a site widget minting per-visitor browser tokens). Recorded immutably and used to enforce per-visitor ownership on this session's events for browser session tokens. Omit when the creator has no per-visitor concept.
                site_ids:
                    type: array
                    maxItems: 100
                    items:
                        type: string
                    description: >-
                        Sites this session may work on. Each must be a site registered in the agent's project. Site and knowledge-base tool calls that name the session in the `Agent-Session-Id` header are refused for any other site, and for any knowledge base collection that is not one of these sites' knowledge bases. Omit or send an empty array to allow every site in the project. An entry that is not such a site is rejected with 400 without saying why.
        UpdateSessionRequest:
            type: object
            description: Partial update for session.
            properties:
                title:
                    type: string
                    nullable: true
                    maxLength: 512
                    description: Session title (null or empty clears).
                reasoning_effort:
                    type: string
                    nullable: true
                    description: >-
                        Session override for reasoning effort. Allowed values are the bound agent's current model `parameters.reasoning_effort` on GET /v1/models. Send null to inherit the agent (then omit). Omit the field to preserve the stored override.
                metadata:
                    type: object
                    nullable: false
                    additionalProperties:
                        type: string
                        nullable: true
                    description: >-
                        Per-key patch: string upserts, null deletes, omit preserves. Keys beginning with "wpe.account_access." are reserved and validated.
                site_ids:
                    type: array
                    nullable: true
                    maxItems: 100
                    items:
                        type: string
                    description: >-
                        Replaces the sites this session may work on (see CreateSessionRequest.site_ids). Send null or an empty array to allow every site in the project. Omit the field to preserve the stored sites.
        SessionResponse:
            type: object
            required:
                - id
                - type
                - agent
                - status
                - usage
                - created_at
            properties:
                id:
                    type: string
                type:
                    type: string
                    enum: [session]
